<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WG Data Export Viewer, phone list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit}
button:focus-visible{outline:3px solid #1a73e8;outline-offset:-3px}
.row:active{background:#e8f0fe}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#f7f7fa;color:#3c4043;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;overflow:hidden">

  <header style="padding:20px 16px 14px;background:#ffffff;border-bottom:1px solid #dadce0">
    <div style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#5f6368">WG Data Export Viewer</div>
    <h1 style="margin:4px 0 2px;font-size:24px;line-height:1.25;font-weight:600;color:#08060d">Tester</h1>
    <div style="font-size:12.5px;color:#5f6368">Account ID 123456789 · Location code EU</div>
    <div style="font-size:12.5px;color:#5f6368">Created 2024-01-01 · Imported Oct 7, 2026</div>
  </header>

  <nav aria-label="Sections" style="flex:1;overflow:auto">
    <ul style="list-style:none;margin:12px 0 0;padding:0;background:#ffffff;border-top:1px solid #dadce0">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
        <li>
          <button class="row" style="all:unset;box-sizing:border-box;width:100%;min-height:64px;padding:10px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto 20px;column-gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid #dadce0;background:#ffffff">
            <span style="display:flex;flex-direction:column;min-width:0">
              <span style="font-size:15px;font-weight:600;color:{{ r.color }}">{{ r.title }}</span>
              <span style="font-size:12.5px;color:#5f6368">{{ r.sub }}</span>
            </span>
            <span style="font-size:15px;font-weight:600;color:{{ r.color }}">{{ r.headline }}</span>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#80868b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>
          </button>
        </li>
      </sc-for>
    </ul>
    <ul style="list-style:none;margin:12px 0 0;padding:0;background:#ffffff;border-top:1px solid #dadce0;border-bottom:1px solid #dadce0">
      <li>
        <button class="row" style="all:unset;box-sizing:border-box;width:100%;min-height:52px;padding:8px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto 20px;column-gap:10px;align-items:center;cursor:pointer;background:#ffffff">
          <span style="font-size:14px;color:#3c4043">Not yet supported</span>
          <span style="font-size:12px;font-weight:600;color:#3c4043;background:#f1f3f4;border:1px solid #dadce0;border-radius:999px;padding:1px 9px">4 folders</span>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#80868b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>
        </button>
      </li>
    </ul>
    <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <button style="all:unset;box-sizing:border-box;min-height:48px;padding:10px 14px;border:1px dashed #80868b;border-radius:8px;text-align:center;font-size:13px;color:#3c4043;background:#ffffff;cursor:pointer">Choose a new export (.zip) to replace this one</button>
      <div style="display:flex;gap:8px">
        <button style="all:unset;box-sizing:border-box;flex:1;min-height:48px;padding:10px 14px;border:1px solid #dadce0;border-radius:8px;text-align:center;font-size:13px;color:#08060d;background:#ffffff;cursor:pointer">Start over</button>
        <button style="all:unset;box-sizing:border-box;flex:1;min-height:48px;padding:10px 14px;text-align:center;font-size:13px;color:#1a73e8;text-decoration:underline;cursor:pointer">Clear my cached data</button>
      </div>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { title: 'Playtime', headline: '412.8 h', sub: '286 sessions · 143 active days', color: '#08060d' },
        { title: 'Login history', headline: '3 IPs', sub: '612 logins · 0 countries matched', color: '#08060d' },
        { title: 'Vehicles', headline: '—', sub: 'WoT is not in this export', color: '#5f6368' },
        { title: 'Finance', headline: '—', sub: 'Not in this export', color: '#5f6368' },
        { title: 'Payments', headline: 'USD 29.97', sub: '3 paid orders', color: '#08060d' },
        { title: 'Account', headline: 'EU', sub: 'Location code and creation date', color: '#08060d' },
      ],
    };
  }
}
</script>
</body>
</html>
