name: CI

# Triggers: push is restricted to main (post-merge verification only) and
# pull_request is bare (every PR, from any branch, is in scope). Standard
# industry pattern to avoid double-running the same commit's gates once for
# `push` and once for `pull_request: synchronize` on every PR update —
# deliberately revisits the prior "bare push, no filters" decision (see git
# history) in favor of this trade-off. Every PR still sees the full set of
# gates before merge; the zero-network spec is part of those gates.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: no secrets needed by any step. The least the workflow
# could be granted is contents: read; never request more.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit + e2e (incl. zero-network)
    runs-on: self-hosted
    # The outermost of the three e2e limits, and the only one that cancels
    # The whole job. It must outlast the shell wrapper (30 min) by enough to
    # cover the steps before it (install, lint, typecheck, unit, browser
    # setup — about 5 min of budget): 30 + 5 = 35 min, so 38 leaves 3 min of
    # headroom on the unmeasured part. tests/unit/guards/ci-budget.test.ts enforces
    # the wrapper + 300 s floor and the wrapper/timeout-minutes ordering.
    #
    # Raised from 25 in plan 05-12, with the wrapper and `globalTimeout`,
    # because the vehicle table's thirteen new browser tests pushed the
    # projected run from 665 s to 730 s and the guard below failed; again from
    # 26 in plan 05-14, because the battle-type, header, Warships,
    # Warplanes, picker, drift, 375px and reset specs took the projection to
    # 835 s and the 1.3x floor to 1085.5 s; again from 27 in plan 05-15,
    # because the ten new spend specs took it to 885 s and the floor to
    # 1150.5 s; and again from 28 in plan 05-16, because the five
    # finance-scale tests and the sixth zero-network test took it to 980 s and
    # the floor to 1274 s. The three limits move together: raising one alone
    # would just move which of them fires first, which is the exact failure the
    # guard exists to prevent.
    #
    # 05-16's arithmetic, J = W + 8 with W = 25 + 2 = 27:
    #
    #   L = 184 tests in 16 files   MEASURED (`playwright test --list`)
    #   E = 980 s                  330 baseline + 5 * 88 + 120 + 90
    #   G = 25 min                 ceil(1.3 * 980 / 60) + 3, and >= 15
    #   W = 27 min                 G + 2
    #   J = 35 min                 W + 8
    #
    # The two orderings the guard enforces both hold with room: 27 min is 1620 s
    # against globalTimeout + 90 s = 1590 s, and 35 min is 2100 s against
    # wrapper + 300 s = 1920 s.
    #
    # Raised from 35 in plan 06-12, with the wrapper and `globalTimeout`, for the
    # country-map browser specs: 218 listed tests projected 1150 s and a floor of
    # 1495 s against a 1500 s `globalTimeout`, so the first added test failed the
    # guard. 225 tests project 1185 s and a floor of 1540.5 s; G = 26 min,
    # W = 28 min, J = 36 min, and 26 min covers up to 228 tests.
    #
    # Raised from 36 in plan 06-14, with the wrapper and `globalTimeout`, for the
    # login scale spec (five tests, priced as a block like the two older scale
    # specs) and the Phase 6 zero-network test. 234 listed tests project 1218 s
    # and a floor of 1583.4 s against a 1560 s `globalTimeout`, so the guard
    # failed; G = 27 min, W = 29 min, J = 37 min, and 27 min covers up to 239
    # tests. The block's allowance is an ESTIMATE (4.2 s measured, times the
    # runner factor the guard already uses); the first CI run replaces it.
    #
    # UNCHANGED in plan 07-03, for the `chromium-mobile` project and its five
    # touch specs. `playwright test --list` counts BOTH projects, so those five
    # are five new listed tests; the `touch-` routing took nothing away from
    # the desktop project. 239 tests in 23 files project 1243 s and a floor of
    # 1615.9 s, so G = 27 min, W = 29 min and J = 37 min all stayed where they
    # were, and 240 tests would have projected 1248 s and a floor of 1622.4 s,
    # which fails the guard — see tests/unit/guards/ci-budget.test.ts.
    #
    # Raised from 27 to 37 -> 38 in plan 07-04, together with the wrapper and
    # `globalTimeout`, because the touch tooltip's last three specs crossed the
    # ceiling 07-03 recorded. `playwright test --list` counts BOTH projects, so
    # those three are three new listed tests on top of 07-03's five: 242 in 23
    # files project 1258 s and a floor of 1635.4 s, so G = 28 min, W = 30 min
    # and J = 38 min. All three move together, which is the rule this file has
    # carried since 05-14.
    #
    # Raised from 38 to 39 in plan 07-05, together with the wrapper and
    # `globalTimeout`, because the phone-width sweep and the touch-target specs
    # took the count to 251 in 25 files: 1303 s projected, a floor of 1693.9 s,
    # so G = 29 min, W = 31 min and J = 39 min.
    timeout-minutes: 39

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No `with: version:` here — package.json's `packageManager` field
        # pins pnpm@12.6.0 and that is what pnpm/action-setup reads.

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Vite pre-bundled deps (~30-60s saved on cold installs when
      # Vite re-pre-bundles ESM deps for vitest / vite). Keyed off
      # pnpm-lock.yaml so the cache invalidates whenever a dep version
      # changes (including Vite itself).
      - name: Cache Vite pre-bundled deps
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            vite-${{ runner.os }}-

      # Cache TypeScript incremental build info. Each tsconfig.{app,node,test}
      # is configured with tsBuildInfoFile writing into node_modules/.tmp/
      # and `incremental: true` enabled — tsc and svelte-check then skip
      # re-checking unchanged files on the next run.
      - name: Cache TypeScript build info
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: node_modules/.tmp
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.app.json', 'tsconfig.node.json', 'tsconfig.test.json') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Lint
        run: pnpm run lint

      # svelte-check is inside the check script because `tsc -b` does not read
      # `.svelte` files: before this the component scripts and templates were
      # never type-checked in CI (06-REVIEW WR-05: a type import that did not
      # exist, and two Phase 5 errors, sat behind a green check).
      - name: Typecheck (tsc -b and svelte-check)
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit

      # Cache Playwright browsers (~150MB download per run otherwise).
      # Both paths listed because the self-hosted runner's OS is not pinned in
      # this workflow: ~/Library/Caches is macOS, ~/.cache is Linux. Playwright
      # writes to whichever exists on the runner, and `actions/cache` happily
      # no-ops on a missing path.
      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The middle of the three e2e limits: the shell wrapper around
      # Playwright's own `globalTimeout` (27 min). It must outlast that
      # globalTimeout by at least 90 s, or the wrapper fires first and the
      # run dies with "operation canceled" and no test context — the failure
      # mode traced in .planning/debug/resolved/ci-e2e-cancel.md.
      # 29 min = 1620 + 120 s, against the rule's 1620 + 90 s floor. The
      # 234 tests project to 1218 s; see tests/unit/guards/ci-budget.test.ts for the
      # arithmetic and 04-13-SUMMARY.md for what is measured and what is
      # still estimated.
      #
      # Unchanged in plan 07-03: the second Playwright project added five
      # listed tests, 239 in 23 files then, which projected 1243 s against the
      # same 27 min `globalTimeout`. The margin shrank from 36.6 s to 4.1 s.
      #
      # Raised from 29 to 30 in plan 07-04, with the `globalTimeout` above and
      # the job timeout, because three more touch specs took the count to 242
      # in 23 files: 1258 s projected, a 1.3x floor of 1635.4 s, and 28 min is
      # the smallest whole number that clears it. The wrapper stays G + 2 so
      # the diagnostic deadline inside Playwright always fires first.
      #
      # Raised from 30 to 31 in plan 07-05, with the `globalTimeout` above and
      # the job timeout, because the sweep and touch-target specs took the
      # count to 251 in 25 files: 1303 s projected and a 1.3x floor of
      # 1693.9 s, which 29 min is the smallest whole number to clear.
      - name: E2E and zero-network guard
        run: pnpm exec timeout 31m playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
