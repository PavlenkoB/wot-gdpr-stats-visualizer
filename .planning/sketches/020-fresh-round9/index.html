<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 020 - Fresh round 9</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding-top:48px;font-family:system-ui,sans-serif}
#variant-nav{position:fixed;top:0;left:0;right:0;z-index:9998;background:#fff;border-bottom:1px solid #e5e5e5;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
.variant-tab{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.variant-tab:hover{background:#f0f0f0}.variant-tab.active{background:#111;color:#fff;border-color:#111}
#sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font:12px system-ui;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:8px;opacity:.4;transition:opacity .2s;display:flex;gap:6px;align-items:center}
#sketch-tools:hover{opacity:1}#sketch-tools button{font:inherit;cursor:pointer}
#frame{margin:0 auto;transition:max-width .2s}

/* shared page */
.app{background:var(--bg);color:var(--text);font-family:var(--font);min-height:calc(100vh - 48px);font-size:14px;line-height:1.5}
.app h1,.app h2,.app h3{font-family:var(--head);margin:0}
.muted{color:var(--muted)}
.btn{font:inherit;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 14px;cursor:pointer;transition:all .15s ease}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
select,input.search{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface2);border-radius:calc(var(--radius) - 2px);padding:14px 16px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:30px;font-weight:var(--numw);font-family:var(--head);line-height:1.2}
.tile .v small{font-size:13px;color:var(--muted);font-weight:400}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin:10px 0}
.hm i{aspect-ratio:1;border-radius:2px;min-width:8px}
.hh{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin:10px 0}
.hh i{height:16px;border-radius:2px}
.legend{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
.legend i{width:14px;height:14px;border-radius:2px}
.bars div{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;font-size:12px;color:var(--muted);padding:2px 0}
.bars b{display:block;height:10px;border-radius:5px;background:var(--r4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:9px 6px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:60ch}
.stat-row{display:flex;gap:6px;align-items:baseline}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* Z1 bauhaus */
.z1 .wr{max-width:1180px;margin:0 auto;padding:26px}.z1 .hero{display:grid;grid-template-columns:repeat(12,1fr);gap:0;border:4px solid #111;background:var(--surface);min-height:360px;position:relative;overflow:hidden}
.z1 .hero .a{grid-column:1/6;background:#f7b500;display:grid;place-items:center;position:relative}.z1 .hero .a .ci{width:min(280px,80%);aspect-ratio:1;border-radius:50%;background:#d62828;display:grid;place-items:center;color:#fff;font-size:clamp(52px,8vw,92px);font-weight:800;letter-spacing:-.04em;line-height:1;text-align:center}
.z1 .hero .a .ci small{display:block;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.z1 .hero .b{grid-column:6/10;background:#1d4e9e;color:#fff;padding:22px;display:flex;flex-direction:column;justify-content:space-between;border-left:4px solid #111;border-right:4px solid #111}
.z1 .hero .b .sq{font-size:clamp(50px,7vw,84px);font-weight:800;line-height:1}.z1 .hero .c{grid-column:10/13;display:grid;grid-template-rows:1fr 1fr}
.z1 .hero .c .tri{background:#f1ead6;position:relative;display:grid;place-items:end center;padding-bottom:10px;font-weight:800;font-size:44px;border-bottom:4px solid #111}.z1 .hero .c .tri:before{content:"";position:absolute;inset:0;background:#d62828;clip-path:polygon(50% 8%,92% 92%,8% 92%)}.z1 .hero .c .tri span{position:relative;color:#fff;padding-bottom:10px}
.z1 .hero .c .nm{padding:16px;background:#111;color:#f1ead6}.z1 .hero h1{font-size:30px;letter-spacing:-.02em}
.z1 .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;margin-top:20px}.z1 .c6{grid-column:span 6}.z1 .c8{grid-column:span 8}.z1 .c4{grid-column:span 4}.z1 .c12{grid-column:span 12}
.z1 .card{border:4px solid #111;padding:18px;background:var(--surface);position:relative}
.z1 .card h2{font-size:18px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:10px;margin-bottom:12px}.z1 .card h2:before{content:"";width:18px;height:18px;background:#d62828;border-radius:50%}
.z1 .card:nth-child(3n+2) h2:before{background:#1d4e9e;border-radius:0}.z1 .card:nth-child(3n) h2:before{background:#f7b500;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.z1 .card .sub{display:none}.z1 .tile{background:var(--surface2);border:2px solid #111;border-radius:0}.z1 .btn{border-radius:0;border:3px solid #111;background:#f1ead6;font-weight:800;text-transform:uppercase}.z1 .btn:hover{background:#f7b500;color:#111}.z1 .btn.primary{background:#d62828;color:#fff}
.z1 select,.z1 input.search{border-radius:0;border:3px solid #111;background:#f1ead6}.z1 th{color:#111;border-bottom:3px solid #111}.z1 td{border-bottom:1px solid #111}.z1 .chip{border-radius:0;border-color:#111;background:#f7b500;color:#111}
.z1 .hm i,.z1 .hh i{border-radius:0;min-width:0}.z1 .bars b{border-radius:0;height:14px;background:#d62828}
/* Z2 night sky */
.z2{background:radial-gradient(ellipse at 50% 120%,#1a2760 0,transparent 60%),#050816;position:relative}
.z2:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 62%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 30%,#fff,transparent),radial-gradient(1px 1px at 63% 78%,#fff,transparent),radial-gradient(1px 1px at 79% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 91% 52%,#fff,transparent),radial-gradient(1px 1px at 7% 84%,#fff,transparent),radial-gradient(1px 1px at 55% 8%,#fff,transparent);opacity:.75}
.z2 .wr{max-width:1180px;margin:0 auto;padding:28px;position:relative}.z2 .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.z2 .hd h1{font-size:30px}
.z2 .card{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(6px);padding:20px;margin-bottom:18px;border-radius:var(--radius)}.z2 .card h2{font-size:17px}.z2 .tile .v{color:var(--primary)}
.z2 .sky{width:100%;height:auto;display:block}.z2 .sky circle{transition:r .15s;cursor:pointer}.z2 .sky circle:hover{stroke:#fff;stroke-width:1.5}.z2 .sky text{fill:var(--muted);font-size:10px}
.z2 .two{display:grid;grid-template-columns:2fr 1fr;gap:18px}.z2 .btn{background:rgba(255,255,255,.08);border-color:var(--border);color:var(--text)}.z2 .btn.primary{background:var(--primary);color:#1a1400}
.z2 select,.z2 input.search{background:rgba(255,255,255,.08);color:var(--text);border-color:var(--border)}.z2 .hm i,.z2 .hh i{min-width:0}.z2 .bars b{background:var(--primary)}
.z2 .ro{min-height:24px;color:var(--primary);font-size:13px;margin-top:6px}
/* Z3 weather */
.z3{background:linear-gradient(180deg,#1f5fae 0,#5a9be0 45%,#e8a76a 100%);background-attachment:fixed}
.z3 .col{max-width:680px;margin:0 auto;padding:30px 18px 60px}.z3 .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.z3 .hero{text-align:center;padding:26px 0 10px}.z3 .hero .nm{font-size:30px;font-weight:400}.z3 .hero .big{font-size:clamp(90px,24vw,150px);font-weight:200;line-height:1;letter-spacing:-.05em}.z3 .hero .big small{font-size:.28em;font-weight:300;letter-spacing:0}
.z3 .hero .d{font-size:19px}.z3 .hero .hl{margin-top:4px;color:var(--muted)}
.z3 .w{background:var(--surface);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:22px;padding:14px 16px;margin-top:14px}
.z3 .w .lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px}
.z3 .hourly{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px}.z3 .hourly div{flex:none;width:44px;text-align:center;font-size:12px}.z3 .hourly .bar{height:70px;display:flex;align-items:flex-end;justify-content:center;margin:6px 0}.z3 .hourly .bar i{width:14px;border-radius:7px;background:linear-gradient(180deg,#ffe27a,#ff9a3c)}
.z3 .wk{display:grid;grid-template-columns:70px 1fr 54px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:15px}.z3 .wk:last-child{border:0}.z3 .rng{height:6px;border-radius:3px;background:rgba(0,0,0,.18);position:relative}.z3 .rng i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#9be8ff,#ffe27a)}
.z3 .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.z3 .g2 .w{margin-top:14px}.z3 .w .v{font-size:36px;font-weight:300}
.z3 .card{border:0;background:none;padding:0}.z3 .btn{border-radius:99px;background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.35)}.z3 .btn.primary{background:#fff;color:#1f5fae}
.z3 select,.z3 input.search{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.35);border-radius:99px}.z3 option{color:#000}.z3 th{color:var(--muted)}.z3 td{border-bottom:1px solid var(--border)}.z3 .tile{background:rgba(255,255,255,.14)}.z3 .tile .v{color:#fff;font-size:24px}.z3 .hm i,.z3 .hh i{min-width:0}.z3 .bars b{background:#fff}.z3 .chip{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.3)}
@media(max-width:700px){.z1 .hero{grid-template-columns:1fr}.z1 .hero .a,.z1 .hero .b,.z1 .hero .c{grid-column:1;border:0}.z1 .hero .a{min-height:260px}.z1 .c6,.z1 .c8,.z1 .c4{grid-column:span 12}.z1 .wr,.z2 .wr{padding:14px}.z2 .two{grid-template-columns:1fr}}

@media(max-width:700px){.tile .v{font-size:22px}}
</style></head><body>
<div id="variant-nav"><button class="variant-tab active" data-v="z1">Z1: Bauhaus</button><button class="variant-tab" data-v="z2">Z2: Night sky scatter</button><button class="variant-tab" data-v="z3">Z3: Weather app</button><span style="margin-left:auto;color:#888;align-self:center;font-size:12px">Z2: hover a star</span></div>
<div id="frame"><div id="root"></div></div>
<div id="sketch-tools"><button onclick="vp('100%')">Desktop</button><button onclick="vp('768px')">Tablet</button><button onclick="vp('375px')">Phone</button></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
function vp(w){$('#frame').style.maxWidth=w}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const days=[...Array(53*7)].map((_,i)=>{const r=rnd();return i>300?0:r<.45?0:Math.min(5,1+Math.floor(r*5.5))});
const hours=[...Array(7*24)].map((_,i)=>{const h=i%24;const peak=(h>=18&&h<=22)?1:(h>=9&&h<=11?.5:0);const r=rnd();return r<.15+(1-peak)*.6?0:Math.min(5,Math.ceil(r*5*Math.max(peak,.3)))});
const lv=l=>`background:var(--r${l})`;
const cal=()=>`<div class="hm">${days.map(l=>`<i style="${lv(l)}" title="level ${l}"></i>`).join('')}</div>`;
const hr=()=>`<div class="hh">${hours.map(l=>`<i style="${lv(l)}"></i>`).join('')}</div>`;
const legend=()=>`<div class="legend">Less ${[0,1,2,3,4,5].map(l=>`<i style="${lv(l)}"></i>`).join('')} More</div>`;
const bars=()=>`<div class="bars">${[['< 1 min',0],['20-30 min',30],['30-60 min',55],['1-2 hours',100],['2-4 hours',22]].map(([n,w])=>`<div><span>${n}</span><b style="width:${w}%;opacity:${w?1:.15}"></b><span>${w?Math.round(w/2.3):0}</span></div>`).join('')}</div>`;
const tiles=()=>`<div class="tiles"><div class="tile"><div class="k">Total playtime</div><div class="v">31.2 <small>hours</small></div></div><div class="tile"><div class="k">Sessions</div><div class="v">30</div></div><div class="tile"><div class="k">Active days</div><div class="v">21</div></div></div>`;
const server=()=>`<div style="display:flex;gap:10px;margin-bottom:14px"><select onchange="toast('Server: '+this.value)"><option>All servers</option><option>EU1</option><option>EU2</option><option>NA1</option></select><span class="chip" style="align-self:center">1 session excluded</span></div>`;
const login=()=>`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><span class="note">IP addresses are masked. The last part of each one is hidden.</span><button class="btn" id="ipbtn" onclick="ipToggle(this)">Show full IP addresses</button></div>
<div class="tiles"><div class="tile"><div class="k">IP addresses</div><div class="v">3</div></div><div class="tile"><div class="k">Countries</div><div class="v">0</div></div><div class="tile"><div class="k">Unknown</div><div class="v">3</div></div></div>
<table><thead><tr><th>IP address</th><th>Country</th><th>Logins</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>
${[['34','192.0.2','2024-01-01','2024-01-23'],['2','198.51.100','2024-01-12','2024-01-15'],['1','203.0.113','2024-01-18','2024-01-18']].map(r=>`<tr><td class="ip" data-p="${r[1]}">${r[1]}.xxx</td><td><span class="chip">Unknown</span></td><td>${r[0]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>
<div style="margin-top:14px"><button class="btn primary" onclick="toast('Would download ~12 MB city file')">Load city-level detail (~12 MB)</button> <span class="note">Nothing from your export is sent.</span></div>`;
function ipToggle(b){const s=b.textContent.startsWith('Show');document.querySelectorAll('.ip').forEach(c=>c.textContent=c.dataset.p+(s?'.17':'.xxx'));b.textContent=s?'Hide full IP addresses':'Show full IP addresses'}
const spend=()=>`<div class="tiles" style="grid-template-columns:1fr 1fr 1fr"><div class="tile"><div class="k">USD spent</div><div class="v">9.99</div></div><div class="tile"><div class="k">Paid orders</div><div class="v">1</div></div><div class="tile"><div class="k">Failed / new</div><div class="v">0 / 0</div></div></div><p class="note">Each currency has its own total: nothing is converted or added across currencies.</p>`;
const vehicles=()=>`<div style="display:flex;gap:10px;margin-bottom:12px"><select><option>WoT</option></select><input class="search" placeholder="Search vehicles"></div><p class="note">WoT is not in this export.</p>`;
const NAV=[['Playtime & logins','on'],['Vehicles',''],['Finance','off'],['Payments',''],['Account','']];
const ident=`<div class="avatar">T</div><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div>`;
const actions=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="toast('Start over?')">Start over</button><button class="btn" onclick="toast('Cache cleared')">Clear cached data</button></div>`;
const secs={play:`<div class="card wide c12"><h2>Playtime</h2><div class="sub">When and how long you played</div>${server()}${tiles()}</div>`};
function Z1(){return `<div class="app t-bau z1"><div class="wr"><div class="hero"><div class="a"><div class="ci"><div>31.2<small>hours</small></div></div></div><div class="b"><div><div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase">Sessions</div><div class="sq">30</div></div><div class="muted" style="color:#cfe0ff">across 21 active days</div></div><div class="c"><div class="tri"><span>21</span></div><div class="nm"><h1>Tester</h1><div style="font-size:12px;opacity:.8">123456789 · EU</div></div></div></div>
<div style="margin-top:16px">${actions}</div>
<div class="grid"><div class="card c12"><h2>Playtime</h2>${server()}${tiles()}</div><div class="card c8"><h2>Hours per day</h2>${cal()}${legend()}</div><div class="card c4"><h2>Session length</h2>${bars()}</div><div class="card c12"><h2>Weekday x hour</h2>${hr()}${legend()}</div><div class="card c12"><h2>Login history</h2>${login()}</div><div class="card c6"><h2>Vehicles</h2>${vehicles()}</div><div class="card c6"><h2>Payments</h2>${spend()}</div></div></div></div>`}
function skySvg(){const W=1000,H=330,L=40,B=24;let o='';const px=d=>L+(d/366)*(W-L-10),py=h=>10+(h/24)*(H-B-10);
for(let h=0;h<=24;h+=6)o+=`<line x1="${L}" x2="${W}" y1="${py(h)}" y2="${py(h)}" stroke="#26336b" stroke-dasharray="3 5"/><text x="4" y="${py(h)+3}">${String(h%24).padStart(2,'0')}:00</text>`;
['Jan','Mar','May','Jul','Sep','Nov'].forEach((m,i)=>o+=`<text x="${px(i*61)}" y="${H-6}">${m}</text>`);
let k=0;for(let d=0;d<366;d++){const l=days[d];if(l<3)continue;const n=l>3?2:1;for(let s=0;s<n;s++){const r=rnd();const h=r<.7?18+Math.floor(rnd()*5):9+Math.floor(rnd()*3)+rnd()*0;const hh=h+rnd();const rad=1.6+l*1.1;o+=`<circle cx="${px(d)}" cy="${py(hh)}" r="${rad}" fill="${l>3?'#ffe9a8':'#8fb4ff'}" opacity="${.45+l*.1}" onmouseover="$('#sro').textContent='Day ${d+1} · ~${String(Math.floor(hh)).padStart(2,'0')}:00 · ${(l*.45).toFixed(1)} h'"/>`;k++}}
return `<svg class="sky" viewBox="0 0 ${W} ${H}" role="img" aria-label="Scatter of sessions: day of year against start hour">${o}</svg>`}
function Z2(){return `<div class="app t-sky z2"><div class="wr"><div class="hd"><h1>Tester's night sky <span class="muted" style="font-size:14px;font-weight:400">every dot is a play session</span></h1>${actions}</div>
<div class="card"><h2>Sessions across the year</h2><div class="muted" style="font-size:13px;margin-bottom:8px">Left to right: January to December. Bottom to top: 24:00 to 00:00. Brighter, bigger stars are longer days.</div>${skySvg()}<div class="ro" id="sro">Hover a star</div></div>
<div class="card">${server()}${tiles()}</div><div class="two"><div class="card"><h2>Weekday x hour</h2>${hr()}${legend()}</div><div class="card"><h2>Session length</h2>${bars()}</div></div>
<div class="card"><h2>Login history</h2>${login()}</div><div class="two"><div class="card"><h2>Vehicles</h2>${vehicles()}</div><div class="card"><h2>Payments</h2>${spend()}</div></div></div></div>`}
function Z3(){const hrs=[...Array(24)].map((_,h)=>{let t=0;for(let d=0;d<7;d++)t+=hours[d*24+h];return t});const mx=Math.max(...hrs);
const wk=[['Week 1',2.4,8.4],['Week 2',1.1,7.2],['Week 3',.8,6.0],['Week 4',.5,4.6],['Week 5',.3,3.4],['Week 6',.2,2.2],['Week 7',0,1.6]];
return `<div class="app t-wx z3"><div class="col"><div class="top"><span class="muted">Imported Oct 7, 2026</span>${actions}</div>
<div class="hero"><div class="nm">Tester</div><div class="big">31.2<small> h</small></div><div class="d">Mostly evenings</div><div class="hl">30 sessions · 21 active days · peak 19:00</div></div>
<div class="w"><div class="lab">🕒 Hourly rhythm</div><div class="hourly">${hrs.map((v,h)=>`<div><span>${String(h).padStart(2,'0')}</span><div class="bar"><i style="height:${Math.max(4,v/mx*100)}%"></i></div><span>${(v*.35).toFixed(1)}</span></div>`).join('')}</div></div>
