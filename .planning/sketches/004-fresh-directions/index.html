<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 004 - Fresh directions</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding-top:48px;font-family:system-ui,sans-serif}
#variant-nav{position:fixed;top:0;left:0;right:0;z-index:9998;background:#fff;border-bottom:1px solid #e5e5e5;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
.variant-tab{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.variant-tab:hover{background:#f0f0f0}.variant-tab.active{background:#111;color:#fff;border-color:#111}
#sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font:12px system-ui;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:8px;opacity:.4;transition:opacity .2s;display:flex;gap:6px;align-items:center}
#sketch-tools:hover{opacity:1}#sketch-tools button{font:inherit;cursor:pointer}
#frame{margin:0 auto;transition:max-width .2s}

/* shared page */
.app{background:var(--bg);color:var(--text);font-family:var(--font);min-height:calc(100vh - 48px);font-size:14px;line-height:1.5}
.app h1,.app h2,.app h3{font-family:var(--head);margin:0}
.muted{color:var(--muted)}
.btn{font:inherit;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 14px;cursor:pointer;transition:all .15s ease}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
select,input.search{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface2);border-radius:calc(var(--radius) - 2px);padding:14px 16px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:30px;font-weight:var(--numw);font-family:var(--head);line-height:1.2}
.tile .v small{font-size:13px;color:var(--muted);font-weight:400}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin:10px 0}
.hm i{aspect-ratio:1;border-radius:2px;min-width:8px}
.hh{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin:10px 0}
.hh i{height:16px;border-radius:2px}
.legend{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
.legend i{width:14px;height:14px;border-radius:2px}
.bars div{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;font-size:12px;color:var(--muted);padding:2px 0}
.bars b{display:block;height:10px;border-radius:5px;background:var(--r4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:9px 6px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:60ch}
.stat-row{display:flex;gap:6px;align-items:baseline}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* J: console */
.j .top{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:48px;z-index:20}
.j .brand{color:var(--primary);font-weight:700;white-space:nowrap}
.j .cmd{flex:1;max-width:480px;display:flex;justify-content:space-between;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 12px;color:var(--muted);cursor:pointer;transition:all .15s}
.j .cmd:hover{border-color:var(--primary);color:var(--text)}
.j kbd{border:1px solid var(--border);border-radius:4px;padding:0 6px;font:inherit;font-size:11px;background:var(--surface2)}
.j .body{display:grid;grid-template-columns:250px 1fr}
.j .tree{border-right:1px solid var(--border);padding:14px 10px;font-size:12.5px;position:sticky;top:96px;height:calc(100vh - 96px);overflow:auto}
.j .tree a{display:flex;justify-content:space-between;padding:4px 8px;border-radius:4px;cursor:pointer;color:var(--muted);transition:all .12s}
.j .tree a:hover{background:var(--surface2);color:var(--text)}.j .tree a.on{background:var(--surface2);color:var(--primary)}
.j .tree .dir{color:var(--text);margin-top:10px;padding:4px 8px}.j .tree .sub{padding-left:22px}
.j .tree small{color:var(--muted)}
.j main{padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.j .card{padding:0;border-radius:6px;overflow:hidden}
.j .card>h2{font-size:12px;font-weight:600;padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);color:var(--muted)}
.j .card>h2:before{content:"$ ";color:var(--primary)}
.j .card>.sub{display:none}
.j .card>div,.j .card>p,.j .card>table{margin-left:14px;margin-right:14px}.j .card>:last-child{margin-bottom:14px}
.j .card>h2+*{margin-top:14px}
.j .tiles{gap:8px}.j .tile{border:1px solid var(--border);background:var(--bg)}.j .tile .v{color:var(--primary);font-size:24px}
.j .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.j .ov{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding-top:15vh}
.j .ov.on{display:flex}
.j .pal{width:min(560px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.j .pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--border);padding:14px 16px;color:var(--text);font:inherit;outline:none}
.j .pal a{display:flex;justify-content:space-between;padding:10px 16px;cursor:pointer;color:var(--text)}.j .pal a:hover,.j .pal a.sel{background:var(--surface2);color:var(--primary)}
/* K: brutalist */
.k .hd{background:#ffd93d;border-bottom:3px solid #111;padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.k .hd h1{font-size:34px;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
.k .hd .tag{background:#111;color:#fff;padding:4px 10px;font-weight:700;font-size:12px;text-transform:uppercase}
.k .nav{display:flex;gap:10px;padding:14px 24px;border-bottom:3px solid #111;background:#fff;overflow-x:auto}
.k .nav a{border:3px solid #111;padding:6px 14px;font-weight:800;text-transform:uppercase;cursor:pointer;background:#fff;box-shadow:3px 3px 0 #111;white-space:nowrap;transition:all .1s}
.k .nav a:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #111}.k .nav a.on{background:var(--accent);}
.k main{max-width:1180px;margin:0 auto;padding:28px 24px;display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.k .card{border:3px solid #111;padding:0;background:#fff}
.k .card>h2{padding:10px 16px;border-bottom:3px solid #111;font-size:18px;font-weight:900;text-transform:uppercase}
.k .card>*:not(h2){margin-left:16px;margin-right:16px}.k .card>h2+.sub{margin-top:12px;margin-bottom:12px}.k .card>:last-child{margin-bottom:16px}.k .card>h2+*:not(.sub){margin-top:16px}
.k .c4{grid-column:span 4}.k .c6{grid-column:span 6}.k .c8{grid-column:span 8}.k .c12{grid-column:span 12}
.k .hc1>h2{background:#ffd93d}.k .hc2>h2{background:#ff8fb1}.k .hc3>h2{background:#8fb4ff}.k .hc4>h2{background:#9be8a8}
.k .tile{border:3px solid #111;border-radius:0;background:#fff}.k .tile:nth-child(1){background:#ffd93d}.k .tile:nth-child(2){background:#ff8fb1}.k .tile:nth-child(3){background:#8fb4ff}
.k .tile .v{font-size:40px;font-weight:900}.k .tile .k{color:#111;font-weight:700}
.k .btn{border:3px solid #111;border-radius:0;font-weight:800;text-transform:uppercase;background:#fff;box-shadow:3px 3px 0 #111}
.k .btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #111;color:#111}.k .btn.primary{background:var(--accent);color:#111}
.k select,.k input.search{border:3px solid #111;border-radius:0;background:#fff;font-weight:700}
.k th{color:#111;font-weight:800;text-transform:uppercase;border-bottom:3px solid #111}.k td{border-bottom:1px solid #111}.k tr:hover td{background:#ffd93d}
.k .chip{border:2px solid #111;border-radius:0;background:#fff;color:#111;font-weight:700}
.k .hm i,.k .hh i{border-radius:0}.k .bars b{border-radius:0;background:#111;height:14px}
.k .sticker{position:absolute;right:28px;top:-14px;transform:rotate(6deg);background:var(--accent);border:3px solid #111;padding:2px 10px;font-weight:900;font-size:12px}
/* L: dossier */
.l .wrap{max-width:1240px;margin:0 auto;padding:24px;display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
.l .prof{position:sticky;top:72px;display:grid;gap:14px}
.l .id{text-align:center;padding:26px 20px;background:linear-gradient(180deg,#26324a,var(--surface))}
.l .id .av{width:92px;height:92px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:38px;font-weight:800;background:radial-gradient(circle at 30% 30%,#fff0b8,#e0b44c 60%,#8a6a1a);color:#2a1f05;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--primary)}
.l .id h1{font-size:24px}.l .rank{display:inline-block;margin-top:8px;background:var(--primary);color:#2a1f05;font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:3px 12px;border-radius:99px}
.l .kv{display:grid;gap:8px;font-size:13px}.l .kv div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--border);padding-bottom:6px}.l .kv span{color:var(--muted)}
.l .medals{display:flex;gap:8px;flex-wrap:wrap}.l .medal{display:flex;gap:6px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:5px 12px;font-size:12px}
.l .medal b{color:var(--primary)}
.l .lnav a{display:block;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);transition:all .15s}
.l .lnav a:hover{background:var(--surface2);color:var(--text)}.l .lnav a.on{background:var(--surface2);color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.l .content{display:grid;gap:16px;min-width:0}
.l .card h2{font-size:15px}.l .tile .v{color:var(--primary)}
@media(max-width:700px){.l .wrap{grid-template-columns:1fr;padding:12px}.l .prof{position:static}.j .body{grid-template-columns:1fr}.j .tree{display:none}.j .two,.k .c4,.k .c6,.k .c8{grid-column:span 12}.j .two{grid-template-columns:1fr}.k main{padding:14px;gap:16px}}

@media(max-width:700px){.tile .v{font-size:22px}}
</style></head><body>
<div id="variant-nav"><button class="variant-tab active" data-v="j">J: Command console</button><button class="variant-tab" data-v="k">K: Neo-brutalist</button><button class="variant-tab" data-v="l">L: Player dossier</button><span style="margin-left:auto;color:#888;align-self:center;font-size:12px">J: try Cmd/Ctrl+K</span></div>
<div id="frame"><div id="root"></div></div>
<div id="sketch-tools"><button onclick="vp('100%')">Desktop</button><button onclick="vp('768px')">Tablet</button><button onclick="vp('375px')">Phone</button></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
function vp(w){$('#frame').style.maxWidth=w}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const days=[...Array(53*7)].map((_,i)=>{const r=rnd();return i>300?0:r<.45?0:Math.min(5,1+Math.floor(r*5.5))});
const hours=[...Array(7*24)].map((_,i)=>{const h=i%24;const peak=(h>=18&&h<=22)?1:(h>=9&&h<=11?.5:0);const r=rnd();return r<.15+(1-peak)*.6?0:Math.min(5,Math.ceil(r*5*Math.max(peak,.3)))});
const lv=l=>`background:var(--r${l})`;
const cal=()=>`<div class="hm">${days.map(l=>`<i style="${lv(l)}" title="level ${l}"></i>`).join('')}</div>`;
const hr=()=>`<div class="hh">${hours.map(l=>`<i style="${lv(l)}"></i>`).join('')}</div>`;
const legend=()=>`<div class="legend">Less ${[0,1,2,3,4,5].map(l=>`<i style="${lv(l)}"></i>`).join('')} More</div>`;
const bars=()=>`<div class="bars">${[['< 1 min',0],['20-30 min',30],['30-60 min',55],['1-2 hours',100],['2-4 hours',22]].map(([n,w])=>`<div><span>${n}</span><b style="width:${w}%;opacity:${w?1:.15}"></b><span>${w?Math.round(w/2.3):0}</span></div>`).join('')}</div>`;
const tiles=()=>`<div class="tiles"><div class="tile"><div class="k">Total playtime</div><div class="v">31.2 <small>hours</small></div></div><div class="tile"><div class="k">Sessions</div><div class="v">30</div></div><div class="tile"><div class="k">Active days</div><div class="v">21</div></div></div>`;
const server=()=>`<div style="display:flex;gap:10px;margin-bottom:14px"><select onchange="toast('Server: '+this.value)"><option>All servers</option><option>EU1</option><option>EU2</option><option>NA1</option></select><span class="chip" style="align-self:center">1 session excluded</span></div>`;
const login=()=>`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><span class="note">IP addresses are masked. The last part of each one is hidden.</span><button class="btn" id="ipbtn" onclick="ipToggle(this)">Show full IP addresses</button></div>
<div class="tiles"><div class="tile"><div class="k">IP addresses</div><div class="v">3</div></div><div class="tile"><div class="k">Countries</div><div class="v">0</div></div><div class="tile"><div class="k">Unknown</div><div class="v">3</div></div></div>
<table><thead><tr><th>IP address</th><th>Country</th><th>Logins</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>
${[['34','192.0.2','2024-01-01','2024-01-23'],['2','198.51.100','2024-01-12','2024-01-15'],['1','203.0.113','2024-01-18','2024-01-18']].map(r=>`<tr><td class="ip" data-p="${r[1]}">${r[1]}.xxx</td><td><span class="chip">Unknown</span></td><td>${r[0]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>
<div style="margin-top:14px"><button class="btn primary" onclick="toast('Would download ~12 MB city file')">Load city-level detail (~12 MB)</button> <span class="note">Nothing from your export is sent.</span></div>`;
function ipToggle(b){const s=b.textContent.startsWith('Show');document.querySelectorAll('.ip').forEach(c=>c.textContent=c.dataset.p+(s?'.17':'.xxx'));b.textContent=s?'Hide full IP addresses':'Show full IP addresses'}
const spend=()=>`<div class="tiles" style="grid-template-columns:1fr 1fr 1fr"><div class="tile"><div class="k">USD spent</div><div class="v">9.99</div></div><div class="tile"><div class="k">Paid orders</div><div class="v">1</div></div><div class="tile"><div class="k">Failed / new</div><div class="v">0 / 0</div></div></div><p class="note">Each currency has its own total: nothing is converted or added across currencies.</p>`;
const vehicles=()=>`<div style="display:flex;gap:10px;margin-bottom:12px"><select><option>WoT</option></select><input class="search" placeholder="Search vehicles"></div><p class="note">WoT is not in this export.</p>`;
const NAV=[['Playtime & logins','on'],['Vehicles',''],['Finance','off'],['Payments',''],['Account','']];
const ident=`<div class="avatar">T</div><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div>`;
const actions=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="toast('Start over?')">Start over</button><button class="btn" onclick="toast('Cache cleared')">Clear cached data</button></div>`;
const secs={play:`<div class="card wide c12"><h2>Playtime</h2><div class="sub">When and how long you played</div>${server()}${tiles()}</div>`};
const toc=[['Playtime',1],['Logins',2],['Vehicles',3],['Payments',4]];
function J(){return `<div class="app t-con j"><div class="top"><span class="brand">wg-export ~/Tester</span><div class="cmd" onclick="pal(1)"><span>Jump to section or run action...</span><span><kbd>⌘K</kbd></span></div><span style="margin-left:auto">${actions}</span></div>
<div class="body"><div class="tree"><div class="muted" style="padding:4px 8px">export.zip</div>
<div class="dir">▾ Activity_history</div><a class="sub on" onclick="jump(this,'s1')">Sessions.csv <small>31</small></a><a class="sub" onclick="jump(this,'s2')">Logins.csv <small>37</small></a>
<div class="dir">▾ Player_statistics</div><a class="sub" onclick="jump(this,'s3')">Vehicles.csv <small>0</small></a>
<div class="dir">▸ Financial_data</div><div class="dir">▾ Payment_history</div><a class="sub" onclick="jump(this,'s4')">Orders.csv <small>1</small></a>
<div class="dir muted">▸ Not yet supported (4)</div></div>
<main><div class="card" id="s1"><h2>playtime --server all</h2>${server()}${tiles()}</div>
<div class="two"><div class="card"><h2>hours-per-day 2024</h2>${cal()}${legend()}</div><div class="card"><h2>session-length</h2>${bars()}</div></div>
<div class="card"><h2>weekday x hour</h2>${hr()}${legend()}</div>
<div class="card" id="s2"><h2>logins --masked</h2>${login()}</div>
<div class="card" id="s3"><h2>vehicles --game wot</h2>${vehicles()}</div>
<div class="card" id="s4"><h2>payments</h2>${spend()}</div></main></div>
<div class="ov" onclick="if(event.target===this)pal(0)"><div class="pal"><input id="q" placeholder="Type a command..." oninput="filt()"><div id="pl"></div></div></div></div>`}
const CMDS=[['Go to Playtime',()=>jmp('s1')],['Go to Login history',()=>jmp('s2')],['Go to Vehicles',()=>jmp('s3')],['Go to Payments',()=>jmp('s4')],['Show full IP addresses',()=>{const b=$('#ipbtn');if(b)ipToggle(b)}],['Start over',()=>toast('Start over?')],['Clear cached data',()=>toast('Cache cleared')]];
function jmp(id){const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
function jump(el,id){el.parentElement.querySelectorAll('a').forEach(a=>a.classList.remove('on'));el.classList.add('on');jmp(id)}
function pal(on){const o=$('.ov');if(!o)return;o.classList.toggle('on',!!on);if(on){$('#q').value='';filt();$('#q').focus()}}
function filt(){const q=$('#q').value.toLowerCase();$('#pl').innerHTML=CMDS.map((c,i)=>[c,i]).filter(([c])=>c[0].toLowerCase().includes(q)).map(([c,i],k)=>`<a class="${k?'':'sel'}" onclick="CMDS[${i}][1]();pal(0)"><span>${c[0]}</span><span class="muted">${c[0].startsWith('Go')?'goto':'action'}</span></a>`).join('')||'<a class="muted">No match</a>'}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();pal(1)}if(e.key==='Escape')pal(0);if(e.key==='Enter'&&$('.j .ov.on')){const s=$('.pal a.sel');if(s)s.click()}});
function K(){return `<div class="app t-brut k"><div class="hd"><h1>Tester</h1><span class="tag">ID 123456789</span><span class="tag" style="background:#ff5c8a;color:#111">EU</span><span style="margin-left:auto">${actions}</span></div>
<div class="nav">${NAV.map(([n,c])=>`<a class="${c==='on'?'on':''}" onclick="navClick(this)">${n}</a>`).join('')}</div>
<main><div class="card hc1 c12" style="position:relative"><span class="sticker">31 HOURS!</span><h2>Playtime</h2>${server()}${tiles()}</div>
<div class="card hc3 c8"><h2>Hours per day</h2><div class="sub">2024</div>${cal()}${legend()}</div>
<div class="card hc2 c4"><h2>Session length</h2><div class="sub">Mostly 1-2h</div>${bars()}</div>
<div class="card hc4 c12"><h2>Weekday & time of day</h2>${hr()}${legend()}</div>
<div class="card hc1 c12"><h2>Login history</h2>${login()}</div>
<div class="card hc3 c6"><h2>Vehicles</h2>${vehicles()}</div>
<div class="card hc2 c6"><h2>Payments</h2>${spend()}</div></main></div>`}
function L(){return `<div class="app t-dos l"><div class="wrap"><aside class="prof"><div class="card id"><div class="av">T</div><h1>Tester</h1><div class="muted">Account 123456789</div><span class="rank">Veteran · 21 active days</span></div>
<div class="card"><div class="kv"><div><span>Region</span>EU</div><div><span>Created</span>2024-01-01</div><div><span>Imported</span>Oct 7, 2026</div><div><span>Playtime</span>31.2 h</div></div></div>
