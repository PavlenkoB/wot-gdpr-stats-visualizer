<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 016 - Fresh round 7</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding-top:48px;font-family:system-ui,sans-serif}
#variant-nav{position:fixed;top:0;left:0;right:0;z-index:9998;background:#fff;border-bottom:1px solid #e5e5e5;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
.variant-tab{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.variant-tab:hover{background:#f0f0f0}.variant-tab.active{background:#111;color:#fff;border-color:#111}
#sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font:12px system-ui;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:8px;opacity:.4;transition:opacity .2s;display:flex;gap:6px;align-items:center}
#sketch-tools:hover{opacity:1}#sketch-tools button{font:inherit;cursor:pointer}
#frame{margin:0 auto;transition:max-width .2s}

/* shared page */
.app{background:var(--bg);color:var(--text);font-family:var(--font);min-height:calc(100vh - 48px);font-size:14px;line-height:1.5}
.app h1,.app h2,.app h3{font-family:var(--head);margin:0}
.muted{color:var(--muted)}
.btn{font:inherit;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 14px;cursor:pointer;transition:all .15s ease}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
select,input.search{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface2);border-radius:calc(var(--radius) - 2px);padding:14px 16px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:30px;font-weight:var(--numw);font-family:var(--head);line-height:1.2}
.tile .v small{font-size:13px;color:var(--muted);font-weight:400}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin:10px 0}
.hm i{aspect-ratio:1;border-radius:2px;min-width:8px}
.hh{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin:10px 0}
.hh i{height:16px;border-radius:2px}
.legend{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
.legend i{width:14px;height:14px;border-radius:2px}
.bars div{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;font-size:12px;color:var(--muted);padding:2px 0}
.bars b{display:block;height:10px;border-radius:5px;background:var(--r4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:9px 6px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:60ch}
.stat-row{display:flex;gap:6px;align-items:baseline}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* X4 aurora glass */
.x4{background:radial-gradient(circle at 15% 10%,#5b3df0 0,transparent 40%),radial-gradient(circle at 85% 20%,#00c2ff 0,transparent 38%),radial-gradient(circle at 70% 85%,#ff4fa3 0,transparent 40%),radial-gradient(circle at 10% 90%,#12d8a0 0,transparent 35%),#0b1020;background-attachment:fixed}
.x4 .wr{max-width:1180px;margin:0 auto;padding:30px;display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.x4 .c4{grid-column:span 4}.x4 .c6{grid-column:span 6}.x4 .c8{grid-column:span 8}.x4 .c12{grid-column:span 12}
.x4 .hd{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.x4 .hd h1{font-size:32px;letter-spacing:-.02em}
.x4 .card{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:var(--shadow);padding:22px;border-radius:var(--radius)}
.x4 .card .sub{display:none}.x4 .tile{background:rgba(255,255,255,.1)}.x4 .tile .v{color:#fff}.x4 .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff;border-radius:99px;backdrop-filter:blur(8px)}
.x4 .btn.primary{background:#fff;color:#1b1450;border-color:#fff}.x4 select,.x4 input.search{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.28);border-radius:99px}.x4 option{color:#000}
.x4 th{color:rgba(255,255,255,.7)}.x4 td{border-bottom:1px solid rgba(255,255,255,.15)}.x4 .chip{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.25)}
.x4 .hm i,.x4 .hh i{min-width:0}.x4 .bars b{background:#fff}
/* X5 sticky notes */
.x5{background-color:#fdfaf3;background-image:radial-gradient(#d9d2bf 1.2px,transparent 1.2px);background-size:24px 24px}
.x5 .wr{max-width:1200px;margin:0 auto;padding:30px}.x5 .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}.x5 .hd h1{font-size:38px;transform:rotate(-1.5deg)}
.x5 .masonry{column-count:3;column-gap:26px}.x5 .stk{break-inside:avoid;margin:0 0 26px;padding:22px 20px 18px;box-shadow:var(--shadow);position:relative;transition:transform .2s}
.x5 .stk:hover{transform:rotate(0) scale(1.02)!important;z-index:2}
.x5 .stk:before{content:"";position:absolute;top:-10px;left:50%;width:76px;height:22px;background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.08);transform:translateX(-50%) rotate(-2deg)}
.x5 .n1{background:#fff3a3;transform:rotate(-1.2deg)}.x5 .n2{background:#ffd1dc;transform:rotate(1deg)}.x5 .n3{background:#c8f0d8;transform:rotate(-.6deg)}.x5 .n4{background:#cde4ff;transform:rotate(1.4deg)}.x5 .n5{background:#fff;transform:rotate(-1deg)}.x5 .n6{background:#ffe2b8;transform:rotate(.8deg)}
.x5 .stk h2{font-size:22px;margin-bottom:8px}.x5 .tiles{grid-template-columns:1fr 1fr 1fr}.x5 .tile{background:rgba(255,255,255,.55);border-radius:2px}.x5 .tile .v{font-size:28px}
.x5 .btn{border-radius:3px;border:2px solid #2b2a33;background:#fff;font-family:var(--font);box-shadow:2px 2px 0 #2b2a33}.x5 .btn.primary{background:var(--primary);color:#fff}.x5 select,.x5 input.search{border-radius:3px;border:2px solid #2b2a33;font-family:var(--font);background:#fff}
.x5 .big{font-size:60px;line-height:1;font-weight:700}.x5 table{font-size:12px}.x5 .hm i,.x5 .hh i{min-width:0;border-radius:1px}.x5 .bars b{border-radius:2px;background:#2b2a33}.x5 .chip{background:#fff;border-radius:2px}
/* X6 streaming shelves */
.x6 .hero{background:linear-gradient(180deg,#2f6b45 0,#121212 100%);padding:44px 34px 24px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.x6 .cover{width:170px;height:170px;border-radius:6px;background:linear-gradient(135deg,#1ed760,#0b6b34);display:grid;place-items:center;font-size:74px;font-weight:800;color:#052b14;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.x6 .hero .k{font-size:12px;font-weight:700;text-transform:uppercase}.x6 .hero h1{font-size:clamp(42px,7vw,84px);font-weight:900;letter-spacing:-.04em;line-height:1}.x6 .hero .m{color:#d9d9d9;font-size:14px;margin-top:10px}
.x6 .act{padding:18px 34px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.x6 .play{width:54px;height:54px;border-radius:50%;background:var(--primary);color:#000;display:grid;place-items:center;font-size:22px;cursor:pointer;transition:transform .15s;border:0}.x6 .play:hover{transform:scale(1.06)}
.x6 .shelf{padding:8px 34px 18px}.x6 .shelf>h2{font-size:22px;margin-bottom:12px}.x6 .row{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px}
.x6 .tl{flex:none;width:210px;background:var(--surface);border-radius:8px;padding:16px;transition:background .2s;cursor:pointer}.x6 .tl:hover{background:var(--surface2)}
.x6 .tl .art{height:120px;border-radius:6px;margin-bottom:12px;display:grid;place-items:center;font-size:34px;font-weight:800;color:#06210f}.x6 .tl b{display:block}.x6 .tl small{color:var(--muted)}
.x6 .wide{flex:none;width:520px;background:var(--surface);border-radius:8px;padding:18px}.x6 .wide h3{font-size:16px;margin-bottom:8px}
.x6 .list{padding:0 34px 80px}.x6 .card{border:0;padding:0;background:none}.x6 .card>h2,.x6 .card .sub{display:none}
.x6 table th{border-bottom:1px solid #333}.x6 td{border:0}.x6 .btn{border-radius:99px;background:transparent;border-color:#777;color:#fff}.x6 .btn:hover{border-color:#fff;color:#fff}.x6 .btn.primary{background:var(--primary);color:#000;border-color:var(--primary)}
.x6 select,.x6 input.search{background:#333;border-color:#333;color:#fff;border-radius:99px}.x6 .hm i,.x6 .hh i{min-width:0}.x6 .tile{background:#242424}
@media(max-width:700px){.x4 .wr{grid-template-columns:1fr;padding:14px}.x4 .c4,.x4 .c6,.x4 .c8,.x4 .c12{grid-column:auto}.x5 .masonry{column-count:1}.x6 .hero,.x6 .act,.x6 .shelf,.x6 .list{padding-left:16px;padding-right:16px}.x6 .wide{width:86vw}}

@media(max-width:700px){.tile .v{font-size:22px}}
</style></head><body>
<div id="variant-nav"><button class="variant-tab active" data-v="x4">X4: Aurora glass</button><button class="variant-tab" data-v="x5">X5: Sticky-note wall</button><button class="variant-tab" data-v="x6">X6: Streaming shelves</button><span style="margin-left:auto;color:#888;align-self:center;font-size:12px"></span></div>
<div id="frame"><div id="root"></div></div>
<div id="sketch-tools"><button onclick="vp('100%')">Desktop</button><button onclick="vp('768px')">Tablet</button><button onclick="vp('375px')">Phone</button></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
function vp(w){$('#frame').style.maxWidth=w}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const days=[...Array(53*7)].map((_,i)=>{const r=rnd();return i>300?0:r<.45?0:Math.min(5,1+Math.floor(r*5.5))});
const hours=[...Array(7*24)].map((_,i)=>{const h=i%24;const peak=(h>=18&&h<=22)?1:(h>=9&&h<=11?.5:0);const r=rnd();return r<.15+(1-peak)*.6?0:Math.min(5,Math.ceil(r*5*Math.max(peak,.3)))});
const lv=l=>`background:var(--r${l})`;
const cal=()=>`<div class="hm">${days.map(l=>`<i style="${lv(l)}" title="level ${l}"></i>`).join('')}</div>`;
const hr=()=>`<div class="hh">${hours.map(l=>`<i style="${lv(l)}"></i>`).join('')}</div>`;
const legend=()=>`<div class="legend">Less ${[0,1,2,3,4,5].map(l=>`<i style="${lv(l)}"></i>`).join('')} More</div>`;
const bars=()=>`<div class="bars">${[['< 1 min',0],['20-30 min',30],['30-60 min',55],['1-2 hours',100],['2-4 hours',22]].map(([n,w])=>`<div><span>${n}</span><b style="width:${w}%;opacity:${w?1:.15}"></b><span>${w?Math.round(w/2.3):0}</span></div>`).join('')}</div>`;
const tiles=()=>`<div class="tiles"><div class="tile"><div class="k">Total playtime</div><div class="v">31.2 <small>hours</small></div></div><div class="tile"><div class="k">Sessions</div><div class="v">30</div></div><div class="tile"><div class="k">Active days</div><div class="v">21</div></div></div>`;
const server=()=>`<div style="display:flex;gap:10px;margin-bottom:14px"><select onchange="toast('Server: '+this.value)"><option>All servers</option><option>EU1</option><option>EU2</option><option>NA1</option></select><span class="chip" style="align-self:center">1 session excluded</span></div>`;
const login=()=>`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><span class="note">IP addresses are masked. The last part of each one is hidden.</span><button class="btn" id="ipbtn" onclick="ipToggle(this)">Show full IP addresses</button></div>
<div class="tiles"><div class="tile"><div class="k">IP addresses</div><div class="v">3</div></div><div class="tile"><div class="k">Countries</div><div class="v">0</div></div><div class="tile"><div class="k">Unknown</div><div class="v">3</div></div></div>
<table><thead><tr><th>IP address</th><th>Country</th><th>Logins</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>
${[['34','192.0.2','2024-01-01','2024-01-23'],['2','198.51.100','2024-01-12','2024-01-15'],['1','203.0.113','2024-01-18','2024-01-18']].map(r=>`<tr><td class="ip" data-p="${r[1]}">${r[1]}.xxx</td><td><span class="chip">Unknown</span></td><td>${r[0]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>
<div style="margin-top:14px"><button class="btn primary" onclick="toast('Would download ~12 MB city file')">Load city-level detail (~12 MB)</button> <span class="note">Nothing from your export is sent.</span></div>`;
function ipToggle(b){const s=b.textContent.startsWith('Show');document.querySelectorAll('.ip').forEach(c=>c.textContent=c.dataset.p+(s?'.17':'.xxx'));b.textContent=s?'Hide full IP addresses':'Show full IP addresses'}
const spend=()=>`<div class="tiles" style="grid-template-columns:1fr 1fr 1fr"><div class="tile"><div class="k">USD spent</div><div class="v">9.99</div></div><div class="tile"><div class="k">Paid orders</div><div class="v">1</div></div><div class="tile"><div class="k">Failed / new</div><div class="v">0 / 0</div></div></div><p class="note">Each currency has its own total: nothing is converted or added across currencies.</p>`;
const vehicles=()=>`<div style="display:flex;gap:10px;margin-bottom:12px"><select><option>WoT</option></select><input class="search" placeholder="Search vehicles"></div><p class="note">WoT is not in this export.</p>`;
const NAV=[['Playtime & logins','on'],['Vehicles',''],['Finance','off'],['Payments',''],['Account','']];
const ident=`<div class="avatar">T</div><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div>`;
const actions=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="toast('Start over?')">Start over</button><button class="btn" onclick="toast('Cache cleared')">Clear cached data</button></div>`;
const secs={play:`<div class="card wide c12"><h2>Playtime</h2><div class="sub">When and how long you played</div>${server()}${tiles()}</div>`};
const cd=(c,b)=>`<div class="card ${c}">${b}</div>`;
function X4(){return `<div class="app t-aur x4"><div class="wr"><div class="hd"><h1>Tester <span class="muted" style="font-size:14px;font-weight:400">123456789 · EU</span></h1>${actions}</div>
${cd('c12','<h2>Playtime</h2>'+server()+tiles())}${cd('c8','<h2>Hours per day</h2>'+cal()+legend())}${cd('c4','<h2>Session length</h2>'+bars())}${cd('c12','<h2>Weekday & time of day</h2>'+hr()+legend())}${cd('c12','<h2>Login history</h2>'+login())}${cd('c6','<h2>Vehicles</h2>'+vehicles())}${cd('c6','<h2>Payments</h2>'+spend())}</div></div>`}
function X5(){const n=(c,b)=>`<div class="stk ${c}">${b}</div>`;
return `<div class="app t-fig x5"><div class="wr"><div class="hd"><h1>Tester's data wall ✏️</h1>${actions}</div><div class="masonry">
${n('n1','<h2>Playtime</h2><div class="big">31.2h</div><div class="muted">30 sessions · 21 days</div>'+server())}
${n('n5','<h2>Hours per day</h2>'+cal()+legend())}
${n('n2','<h2>Session length</h2>'+bars()+'<p>→ most are 1-2 hours!</p>')}
${n('n3','<h2>Logins</h2>'+login())}
${n('n4','<h2>Weekday & hour</h2>'+hr()+legend()+'<p>★ Friday evenings</p>')}
${n('n6','<h2>Payments</h2>'+spend())}
${n('n1','<h2>Vehicles</h2>'+vehicles())}</div></div></div>`}
function X6(){const t=(g,i,a,b)=>`<div class="tl"><div class="art" style="background:${g}">${i}</div><b>${a}</b><small>${b}</small></div>`;
return `<div class="app t-strm x6"><div class="hero"><div class="cover">T</div><div><div class="k">Account export</div><h1>Tester</h1><div class="m">123456789 · EU · 30 sessions · 31.2 hours · imported Oct 7, 2026</div></div></div>
<div class="act"><button class="play" onclick="toast('Jump to first chart')">▶</button>${actions}</div>
<div class="shelf"><h2>Your numbers</h2><div class="row">${t('linear-gradient(135deg,#1ed760,#0b6b34)','31.2h','Playtime','30 sessions')}${t('linear-gradient(135deg,#f573a0,#7a1f4a)','21','Active days','of 2024')}${t('linear-gradient(135deg,#6ea8ff,#1d3e86)','19:00','Busiest hour','Fri-Sun')}${t('linear-gradient(135deg,#ffc864,#8a5a00)','1-2h','Typical session','53% of sessions')}${t('linear-gradient(135deg,#b49bff,#3d2a8a)','3','Login IPs','37 logins')}${t('linear-gradient(135deg,#9be8c9,#1f6b52)','$9.99','Payments','1 order')}</div></div>
<div class="shelf"><h2>Made for you: rhythm</h2><div class="row"><div class="wide"><h3>Hours per day · 2024</h3>${cal()}${legend()}</div><div class="wide"><h3>Weekday x hour</h3>${hr()}${legend()}</div><div class="wide"><h3>Session length</h3>${bars()}</div></div></div>
<div class="list"><h2 style="font-size:22px;margin-bottom:10px">Login history</h2>${login()}<h2 style="font-size:22px;margin:26px 0 10px">Payments</h2>${spend()}</div></div>`}

const R={x4:X4,x5:X5,x6:X6};
function show(v){$('#root').innerHTML=R[v]();document.querySelectorAll('.variant-tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));if(window.after)after(v)}
document.querySelectorAll('.variant-tab').forEach(t=>t.onclick=()=>show(t.dataset.v));
show('x4');
</script></body></html>
