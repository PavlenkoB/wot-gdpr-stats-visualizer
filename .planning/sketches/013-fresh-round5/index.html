<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 013 - Fresh round 5</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding-top:48px;font-family:system-ui,sans-serif}
#variant-nav{position:fixed;top:0;left:0;right:0;z-index:9998;background:#fff;border-bottom:1px solid #e5e5e5;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
.variant-tab{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.variant-tab:hover{background:#f0f0f0}.variant-tab.active{background:#111;color:#fff;border-color:#111}
#sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font:12px system-ui;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:8px;opacity:.4;transition:opacity .2s;display:flex;gap:6px;align-items:center}
#sketch-tools:hover{opacity:1}#sketch-tools button{font:inherit;cursor:pointer}
#frame{margin:0 auto;transition:max-width .2s}

/* shared page */
.app{background:var(--bg);color:var(--text);font-family:var(--font);min-height:calc(100vh - 48px);font-size:14px;line-height:1.5}
.app h1,.app h2,.app h3{font-family:var(--head);margin:0}
.muted{color:var(--muted)}
.btn{font:inherit;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 14px;cursor:pointer;transition:all .15s ease}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
select,input.search{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface2);border-radius:calc(var(--radius) - 2px);padding:14px 16px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:30px;font-weight:var(--numw);font-family:var(--head);line-height:1.2}
.tile .v small{font-size:13px;color:var(--muted);font-weight:400}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin:10px 0}
.hm i{aspect-ratio:1;border-radius:2px;min-width:8px}
.hh{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin:10px 0}
.hh i{height:16px;border-radius:2px}
.legend{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
.legend i{width:14px;height:14px;border-radius:2px}
.bars div{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;font-size:12px;color:var(--muted);padding:2px 0}
.bars b{display:block;height:10px;border-radius:5px;background:var(--r4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:9px 6px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:60ch}
.stat-row{display:flex;gap:6px;align-items:baseline}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* W1 kanban */
.w1 .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}.w1 .hd h1{font-size:20px}
.w1 .board{display:flex;gap:16px;padding:20px 24px;overflow-x:auto;align-items:flex-start;min-height:calc(100vh - 130px)}
.w1 .col{flex:none;width:400px;background:var(--surface2);border-radius:12px;padding:10px;display:grid;gap:10px}
.w1 .col>h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px;padding:4px 6px;color:var(--muted)}
.w1 .col>h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}.w1 .col>h3 span{margin-left:auto;background:var(--surface);border-radius:99px;padding:0 8px}
.w1 .card{border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.05);padding:14px;cursor:grab;transition:box-shadow .15s,transform .15s}
.w1 .card:hover{box-shadow:0 6px 16px rgba(0,0,0,.1);transform:translateY(-1px)}.w1 .card h2{font-size:14px;display:flex;justify-content:space-between}.w1 .card h2:after{content:"⋮⋮";color:#c3c0b8;letter-spacing:-2px}
.w1 .card .sub{display:none}.w1 .tile .v{font-size:22px}.w1 .hm i,.w1 .hh i{min-width:0}.w1 table{font-size:12px}.w1 th,.w1 td{padding:7px 4px}
.w1 .big{font-size:36px;font-weight:700}.w1 .card.drag{opacity:.4}
/* W2 newspaper */
.w2 .paper{max-width:1180px;margin:0 auto;padding:22px 28px 60px}
.w2 .mast{text-align:center;border-bottom:4px double #1a1a1a;padding-bottom:10px}.w2 .mast h1{font-family:var(--head);font-size:clamp(40px,8vw,84px);font-weight:900;letter-spacing:-.02em;line-height:1}
.w2 .dl{display:flex;justify-content:space-between;border-bottom:1px solid #1a1a1a;padding:6px 0;font-size:12px;text-transform:uppercase;letter-spacing:.12em;flex-wrap:wrap;gap:8px}
.w2 .headl{text-align:center;padding:22px 0 12px;border-bottom:1px solid #1a1a1a}.w2 .headl h2{font-family:var(--head);font-size:clamp(30px,5vw,56px);font-weight:900;line-height:1.05}.w2 .headl p{font-style:italic;color:var(--muted);font-size:18px}
.w2 .cols{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:0;margin-top:18px}.w2 .cols>div{padding:0 20px;border-right:1px solid #1a1a1a}.w2 .cols>div:first-child{padding-left:0}.w2 .cols>div:last-child{border:0;padding-right:0}
.w2 h3{font-family:var(--head);font-size:22px;border-bottom:2px solid #1a1a1a;padding-bottom:4px;margin:0 0 10px}
.w2 .fig{border:1px solid #1a1a1a;padding:10px;margin:14px 0;background:var(--surface)}.w2 .fig .cap{font-size:11px;font-style:italic;color:var(--muted);margin-top:6px}
.w2 .drop:first-letter{font-size:56px;float:left;line-height:.85;padding:4px 8px 0 0;font-weight:900;font-family:var(--head)}.w2 p{margin:0 0 10px;font-size:15px;line-height:1.5}
.w2 .tile{background:transparent;border:1px solid #1a1a1a;border-radius:0}.w2 .tile .v{font-family:var(--head);font-size:34px}.w2 .card{border:0;padding:0;background:none}.w2 .card .sub{display:none}.w2 .card>h2{display:none}
.w2 .btn{border-radius:0;border:1px solid #1a1a1a;background:transparent;font-family:var(--font)}.w2 .btn.primary{background:#1a1a1a;color:#fff}.w2 select,.w2 input.search{border-radius:0;font-family:var(--font)}
.w2 th{border-bottom:2px solid #1a1a1a;color:#1a1a1a;font-family:var(--head)}.w2 td{border-bottom:1px dotted #1a1a1a}.w2 .chip{border-radius:0}.w2 .hm i,.w2 .hh i{border-radius:0;min-width:0}.w2 .bars b{border-radius:0}.w2 .classif{border:2px solid #1a1a1a;padding:12px;margin-top:14px}
/* W3 rings */
.w3 .wrap{max-width:1100px;margin:0 auto;padding:26px}.w3 .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.w3 .hd h1{font-size:32px;font-weight:800}
.w3 .hero{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:26px;align-items:center;background:var(--surface);border-radius:28px;padding:26px;margin-bottom:16px}
.w3 .hero svg{width:100%;height:auto}.w3 .rs{display:grid;gap:18px}.w3 .rs .r .k{font-size:13px;font-weight:600}.w3 .rs .r .v{font-size:34px;font-weight:800;letter-spacing:-.02em}.w3 .rs .r .v small{font-size:16px}
.w3 .g{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.w3 .c6{grid-column:span 6}.w3 .c4{grid-column:span 4}.w3 .c2{grid-column:span 2}.w3 .c3{grid-column:span 3}
.w3 .card{border:0;padding:22px;border-radius:24px}.w3 .tile .v{color:var(--accent)}.w3 .btn{border-radius:99px}.w3 .btn.primary{background:var(--primary);color:#fff}
@media(max-width:700px){.w2 .cols{grid-template-columns:1fr}.w2 .cols>div{border:0;padding:0;margin-bottom:20px}.w3 .hero{grid-template-columns:1fr}.w3 .g{grid-template-columns:1fr}.w3 .c6,.w3 .c4,.w3 .c2,.w3 .c3{grid-column:auto}.w1 .col{width:86vw}}

@media(max-width:700px){.tile .v{font-size:22px}}
</style></head><body>
<div id="variant-nav"><button class="variant-tab active" data-v="w1">W1: Kanban board</button><button class="variant-tab" data-v="w2">W2: Newspaper</button><button class="variant-tab" data-v="w3">W3: Activity rings</button><span style="margin-left:auto;color:#888;align-self:center;font-size:12px">W1: scroll sideways</span></div>
<div id="frame"><div id="root"></div></div>
<div id="sketch-tools"><button onclick="vp('100%')">Desktop</button><button onclick="vp('768px')">Tablet</button><button onclick="vp('375px')">Phone</button></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
function vp(w){$('#frame').style.maxWidth=w}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const days=[...Array(53*7)].map((_,i)=>{const r=rnd();return i>300?0:r<.45?0:Math.min(5,1+Math.floor(r*5.5))});
const hours=[...Array(7*24)].map((_,i)=>{const h=i%24;const peak=(h>=18&&h<=22)?1:(h>=9&&h<=11?.5:0);const r=rnd();return r<.15+(1-peak)*.6?0:Math.min(5,Math.ceil(r*5*Math.max(peak,.3)))});
const lv=l=>`background:var(--r${l})`;
const cal=()=>`<div class="hm">${days.map(l=>`<i style="${lv(l)}" title="level ${l}"></i>`).join('')}</div>`;
const hr=()=>`<div class="hh">${hours.map(l=>`<i style="${lv(l)}"></i>`).join('')}</div>`;
const legend=()=>`<div class="legend">Less ${[0,1,2,3,4,5].map(l=>`<i style="${lv(l)}"></i>`).join('')} More</div>`;
const bars=()=>`<div class="bars">${[['< 1 min',0],['20-30 min',30],['30-60 min',55],['1-2 hours',100],['2-4 hours',22]].map(([n,w])=>`<div><span>${n}</span><b style="width:${w}%;opacity:${w?1:.15}"></b><span>${w?Math.round(w/2.3):0}</span></div>`).join('')}</div>`;
const tiles=()=>`<div class="tiles"><div class="tile"><div class="k">Total playtime</div><div class="v">31.2 <small>hours</small></div></div><div class="tile"><div class="k">Sessions</div><div class="v">30</div></div><div class="tile"><div class="k">Active days</div><div class="v">21</div></div></div>`;
const server=()=>`<div style="display:flex;gap:10px;margin-bottom:14px"><select onchange="toast('Server: '+this.value)"><option>All servers</option><option>EU1</option><option>EU2</option><option>NA1</option></select><span class="chip" style="align-self:center">1 session excluded</span></div>`;
const login=()=>`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><span class="note">IP addresses are masked. The last part of each one is hidden.</span><button class="btn" id="ipbtn" onclick="ipToggle(this)">Show full IP addresses</button></div>
<div class="tiles"><div class="tile"><div class="k">IP addresses</div><div class="v">3</div></div><div class="tile"><div class="k">Countries</div><div class="v">0</div></div><div class="tile"><div class="k">Unknown</div><div class="v">3</div></div></div>
<table><thead><tr><th>IP address</th><th>Country</th><th>Logins</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>
${[['34','192.0.2','2024-01-01','2024-01-23'],['2','198.51.100','2024-01-12','2024-01-15'],['1','203.0.113','2024-01-18','2024-01-18']].map(r=>`<tr><td class="ip" data-p="${r[1]}">${r[1]}.xxx</td><td><span class="chip">Unknown</span></td><td>${r[0]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>
<div style="margin-top:14px"><button class="btn primary" onclick="toast('Would download ~12 MB city file')">Load city-level detail (~12 MB)</button> <span class="note">Nothing from your export is sent.</span></div>`;
function ipToggle(b){const s=b.textContent.startsWith('Show');document.querySelectorAll('.ip').forEach(c=>c.textContent=c.dataset.p+(s?'.17':'.xxx'));b.textContent=s?'Hide full IP addresses':'Show full IP addresses'}
const spend=()=>`<div class="tiles" style="grid-template-columns:1fr 1fr 1fr"><div class="tile"><div class="k">USD spent</div><div class="v">9.99</div></div><div class="tile"><div class="k">Paid orders</div><div class="v">1</div></div><div class="tile"><div class="k">Failed / new</div><div class="v">0 / 0</div></div></div><p class="note">Each currency has its own total: nothing is converted or added across currencies.</p>`;
const vehicles=()=>`<div style="display:flex;gap:10px;margin-bottom:12px"><select><option>WoT</option></select><input class="search" placeholder="Search vehicles"></div><p class="note">WoT is not in this export.</p>`;
const NAV=[['Playtime & logins','on'],['Vehicles',''],['Finance','off'],['Payments',''],['Account','']];
const ident=`<div class="avatar">T</div><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div>`;
const actions=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="toast('Start over?')">Start over</button><button class="btn" onclick="toast('Cache cleared')">Clear cached data</button></div>`;
const secs={play:`<div class="card wide c12"><h2>Playtime</h2><div class="sub">When and how long you played</div>${server()}${tiles()}</div>`};
function W1(){const col=(t,c,n,body)=>`<div class="col"><h3><i style="background:${c}"></i>${t}<span>${n}</span></h3>${body}</div>`;
return `<div class="app t-dbv w1"><div class="hd"><h1>📋 Tester's export board</h1>${actions}</div><div class="board">
${col('Activity','#2383e2',4,`<div class="card"><h2>Playtime</h2><div class="big">31.2 h</div>${server()}${tiles()}</div><div class="card"><h2>Hours per day</h2>${cal()}${legend()}</div><div class="card"><h2>Weekday & time</h2>${hr()}${legend()}</div><div class="card"><h2>Session length</h2>${bars()}</div>`)}
${col('Logins','#0f9d58',2,`<div class="card"><h2>Summary</h2><div class="big">3 IPs</div><div class="muted">37 logins · 0 countries matched</div></div><div class="card"><h2>IP addresses</h2>${login()}</div>`)}
${col('Spend','#d9730d',2,`<div class="card"><h2>Payments</h2>${spend()}</div><div class="card"><h2>Vehicles</h2>${vehicles()}</div>`)}
${col('Account','#9b51e0',1,`<div class="card"><h2>Identity</h2><div class="props">Tester<br><span class="muted">123456789 · EU<br>created 2024-01-01<br>imported 2026-10-07</span></div></div>`)}
</div></div>`}
function W2(){return `<div class="app t-news w2"><div class="paper"><div class="mast"><h1>The Tester Times</h1></div><div class="dl"><span>Vol. 1 · Account 123456789</span><span>Region EU · Imported 7 Oct 2026</span><span>Printed on your machine · 0 network requests</span></div>
<div class="headl"><h2>31.2 Hours in the Tanks</h2><p>Thirty sessions across twenty-one days; evenings rule the schedule</p></div>
<div class="cols"><div><h3>By the Numbers</h3>${server()}${tiles()}<div class="fig">${bars()}<div class="cap">Fig. 2 — Session length. Most sessions run one to two hours.</div></div><div class="classif"><h3 style="font-size:16px">Classifieds</h3><p style="font-size:13px">Paid orders: <b>1</b> · Spend: <b>USD 9.99</b></p>${vehicles()}</div></div>
<div><h3>The Daily Grind</h3><p class="drop">Over the year the account logged battles on twenty-one separate days. The busiest stretches fall on Friday to Sunday evenings, with a smaller morning peak around nine.</p><div class="fig">${cal()}${legend()}<div class="cap">Fig. 1 — Hours per day, 2024. Darker means a busier day.</div></div><div class="fig">${hr()}${legend()}<div class="cap">Fig. 3 — Weekday against hour of day.</div></div></div>
<div><h3>Login Ledger</h3><p style="font-size:13px">Thirty-seven logins from three addresses. Last parts of addresses are masked.</p>${login()}<div style="margin-top:14px">${actions}</div></div></div></div></div>`}
function ring(cx,cy,r,pct,color,w){const c=2*Math.PI*r;return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-opacity=".2" stroke-width="${w}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 ${cx} ${cy})"><animate attributeName="stroke-dasharray" from="0 ${c}" to="${c*pct/100} ${c}" dur="1s" fill="freeze"/></circle>`}
function W3(){return `<div class="app t-fit w3"><div class="wrap"><div class="hd"><h1>Tester</h1>${actions}</div>
<div class="hero"><svg viewBox="0 0 300 300" role="img" aria-label="Three rings: evenings 68 percent, weekends 42 percent, sessions over one hour 53 percent">${ring(150,150,120,68,'#fa114f',26)}${ring(150,150,90,42,'#a6ff00',26)}${ring(150,150,60,53,'#00d4ff',26)}</svg>
<div class="rs"><div class="r"><div class="k" style="color:#fa114f">EVENINGS · 18-23h</div><div class="v">68<small>% of your hours</small></div></div><div class="r"><div class="k" style="color:#a6ff00">WEEKENDS</div><div class="v">42<small>% of your hours</small></div></div><div class="r"><div class="k" style="color:#00d4ff">LONG SESSIONS · 1h+</div><div class="v">53<small>% of your sessions</small></div></div><div class="muted" style="font-size:12px">Computed from your export, in this tab.</div></div></div>
<div class="g"><div class="card c2"><div class="muted">Playtime</div><div style="font-size:44px;font-weight:800">31.2<small style="font-size:16px"> h</small></div>${server()}</div><div class="card c2"><div class="muted">Sessions</div><div style="font-size:44px;font-weight:800">30</div></div><div class="card c2"><div class="muted">Active days</div><div style="font-size:44px;font-weight:800">21</div></div>
<div class="card c4"><h2>Hours per day</h2><div class="sub">2024</div>${cal()}${legend()}</div><div class="card c2"><h2>Session length</h2><div class="sub">&nbsp;</div>${bars()}</div>
<div class="card c6"><h2>Weekday & time of day</h2>${hr()}${legend()}</div><div class="card c6"><h2>Login history</h2>${login()}</div><div class="card c3"><h2>Vehicles</h2>${vehicles()}</div><div class="card c3"><h2>Payments</h2>${spend()}</div></div></div></div>`}

const R={w1:W1,w2:W2,w3:W3};
function show(v){$('#root').innerHTML=R[v]();document.querySelectorAll('.variant-tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));if(window.after)after(v)}
document.querySelectorAll('.variant-tab').forEach(t=>t.onclick=()=>show(t.dataset.v));
show('w1');
</script></body></html>
