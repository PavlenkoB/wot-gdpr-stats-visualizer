<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 009 - Fresh round 4</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding-top:48px;font-family:system-ui,sans-serif}
#variant-nav{position:fixed;top:0;left:0;right:0;z-index:9998;background:#fff;border-bottom:1px solid #e5e5e5;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
.variant-tab{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.variant-tab:hover{background:#f0f0f0}.variant-tab.active{background:#111;color:#fff;border-color:#111}
#sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font:12px system-ui;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:8px;opacity:.4;transition:opacity .2s;display:flex;gap:6px;align-items:center}
#sketch-tools:hover{opacity:1}#sketch-tools button{font:inherit;cursor:pointer}
#frame{margin:0 auto;transition:max-width .2s}

/* shared page */
.app{background:var(--bg);color:var(--text);font-family:var(--font);min-height:calc(100vh - 48px);font-size:14px;line-height:1.5}
.app h1,.app h2,.app h3{font-family:var(--head);margin:0}
.muted{color:var(--muted)}
.btn{font:inherit;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 14px;cursor:pointer;transition:all .15s ease}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
select,input.search{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface2);border-radius:calc(var(--radius) - 2px);padding:14px 16px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:30px;font-weight:var(--numw);font-family:var(--head);line-height:1.2}
.tile .v small{font-size:13px;color:var(--muted);font-weight:400}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin:10px 0}
.hm i{aspect-ratio:1;border-radius:2px;min-width:8px}
.hh{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin:10px 0}
.hh i{height:16px;border-radius:2px}
.legend{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
.legend i{width:14px;height:14px;border-radius:2px}
.bars div{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;font-size:12px;color:var(--muted);padding:2px 0}
.bars b{display:block;height:10px;border-radius:5px;background:var(--r4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:9px 6px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:60ch}
.stat-row{display:flex;gap:6px;align-items:baseline}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* R1 polar */
.r1 .wrap{max-width:1180px;margin:0 auto;padding:26px;display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:22px}
.r1 .hd{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.r1 .hd h1{font-size:26px}
.r1 .clock{display:grid;place-items:center;position:relative}.r1 .clock svg{width:100%;max-width:500px;height:auto}
.r1 .clock .ctr{position:absolute;text-align:center;pointer-events:none}.r1 .clock .ctr b{display:block;font-size:44px;color:var(--primary);font-weight:800;text-shadow:0 0 22px rgba(94,231,255,.45)}
.r1 .side{display:grid;gap:14px;align-content:start;min-width:0}.r1 .full{grid-column:1/-1}
.r1 .card .sub{display:none}.r1 .tile .v{color:var(--primary)}
.r1 path{transition:opacity .15s}.r1 path:hover{opacity:.7;stroke:#fff;stroke-width:1}
/* R2 receipt */
.r2{display:grid;place-items:start center;padding:30px 12px 80px}
.r2 .paper{width:min(440px,100%);background:var(--surface);color:var(--text);padding:28px 26px 40px;box-shadow:0 20px 50px rgba(0,0,0,.5);position:relative;-webkit-mask:radial-gradient(circle 8px at 8px 100%,#0000 98%,#000) 0 0/16px 100%;mask:radial-gradient(circle 8px at 8px 100%,#0000 98%,#000) 0 0/16px 100%}
.r2 .paper:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.015) 3px 4px);pointer-events:none}
.r2 .c{text-align:center}.r2 h1{font-size:22px;letter-spacing:.14em;text-transform:uppercase}
.r2 .sep{border:0;border-top:2px dashed var(--r2);margin:16px 0}.r2 .ln{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.r2 .ln span:last-child{font-weight:700}
.r2 .tot{font-size:22px;border-top:2px solid var(--text);border-bottom:2px solid var(--text);padding:6px 0;margin:10px 0}
.r2 .sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:18px 0 6px;color:var(--muted)}
.r2 .tile{background:transparent;border:1px dashed var(--r2);padding:8px 10px;border-radius:0}.r2 .tile .v{font-size:22px}
.r2 .tiles{gap:6px}.r2 table{font-size:12px}.r2 th,.r2 td{padding:5px 3px}.r2 .btn{border-radius:0;border:2px solid var(--text);background:transparent;font-size:12px;text-transform:uppercase}
.r2 .btn:hover{background:var(--text);color:#fff}.r2 .btn.primary{background:var(--text);color:#fff}
.r2 .hm i,.r2 .hh i{border-radius:0;min-width:0}.r2 .chip{border-radius:0;background:transparent}.r2 .bars b{border-radius:0;height:8px}
.r2 .barcode{height:44px;margin-top:20px;background:repeating-linear-gradient(90deg,#1d1b16 0 2px,transparent 2px 4px,#1d1b16 4px 5px,transparent 5px 9px,#1d1b16 9px 12px,transparent 12px 14px)}
.r2 select,.r2 input.search{border-radius:0;font:inherit}
/* R3 database views */
.r3 .top{display:flex;gap:10px;align-items:center;padding:14px 32px;border-bottom:1px solid var(--border)}.r3 .top .muted{font-size:13px}
.r3 .pg{max-width:1100px;margin:0 auto;padding:30px 32px}.r3 .pg h1{font-size:34px;font-weight:700;margin-bottom:4px}.r3 .props{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13px;margin:14px 0 26px;color:var(--muted)}.r3 .props b{color:var(--text);font-weight:500}
.r3 .db{margin-bottom:34px}.r3 .db>.hdr{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px;flex-wrap:wrap}
.r3 .db h2{font-size:18px}.r3 .vt{display:flex;gap:2px;margin-left:8px}.r3 .vt a{padding:4px 10px;border-radius:5px;cursor:pointer;color:var(--muted);font-size:13px}.r3 .vt a:hover{background:var(--surface2)}.r3 .vt a.on{background:var(--surface2);color:var(--text);font-weight:600}
.r3 .chips{display:flex;gap:6px;margin-left:auto}.r3 .chips span{border:1px solid var(--border);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted)}
.r3 .vw{display:none}.r3 .vw.on{display:block}
.r3 table td:first-child{font-weight:500}.r3 .card{border:0;padding:0;background:none}.r3 .tile{background:var(--surface2);border-radius:6px}
.r3 .btn{border-radius:6px}.r3 .btn.primary{background:var(--primary)}
@media(max-width:700px){.r1 .wrap{grid-template-columns:1fr;padding:12px}.r3 .pg{padding:16px}.r3 .props{grid-template-columns:90px 1fr}}

@media(max-width:700px){.tile .v{font-size:22px}}
</style></head><body>
<div id="variant-nav"><button class="variant-tab active" data-v="r1">R1: Polar clock</button><button class="variant-tab" data-v="r2">R2: Receipt</button><button class="variant-tab" data-v="r3">R3: Database views</button><span style="margin-left:auto;color:#888;align-self:center;font-size:12px">R3: toggle Table / Chart per section</span></div>
<div id="frame"><div id="root"></div></div>
<div id="sketch-tools"><button onclick="vp('100%')">Desktop</button><button onclick="vp('768px')">Tablet</button><button onclick="vp('375px')">Phone</button></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
function vp(w){$('#frame').style.maxWidth=w}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const days=[...Array(53*7)].map((_,i)=>{const r=rnd();return i>300?0:r<.45?0:Math.min(5,1+Math.floor(r*5.5))});
const hours=[...Array(7*24)].map((_,i)=>{const h=i%24;const peak=(h>=18&&h<=22)?1:(h>=9&&h<=11?.5:0);const r=rnd();return r<.15+(1-peak)*.6?0:Math.min(5,Math.ceil(r*5*Math.max(peak,.3)))});
const lv=l=>`background:var(--r${l})`;
const cal=()=>`<div class="hm">${days.map(l=>`<i style="${lv(l)}" title="level ${l}"></i>`).join('')}</div>`;
const hr=()=>`<div class="hh">${hours.map(l=>`<i style="${lv(l)}"></i>`).join('')}</div>`;
const legend=()=>`<div class="legend">Less ${[0,1,2,3,4,5].map(l=>`<i style="${lv(l)}"></i>`).join('')} More</div>`;
const bars=()=>`<div class="bars">${[['< 1 min',0],['20-30 min',30],['30-60 min',55],['1-2 hours',100],['2-4 hours',22]].map(([n,w])=>`<div><span>${n}</span><b style="width:${w}%;opacity:${w?1:.15}"></b><span>${w?Math.round(w/2.3):0}</span></div>`).join('')}</div>`;
const tiles=()=>`<div class="tiles"><div class="tile"><div class="k">Total playtime</div><div class="v">31.2 <small>hours</small></div></div><div class="tile"><div class="k">Sessions</div><div class="v">30</div></div><div class="tile"><div class="k">Active days</div><div class="v">21</div></div></div>`;
const server=()=>`<div style="display:flex;gap:10px;margin-bottom:14px"><select onchange="toast('Server: '+this.value)"><option>All servers</option><option>EU1</option><option>EU2</option><option>NA1</option></select><span class="chip" style="align-self:center">1 session excluded</span></div>`;
const login=()=>`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><span class="note">IP addresses are masked. The last part of each one is hidden.</span><button class="btn" id="ipbtn" onclick="ipToggle(this)">Show full IP addresses</button></div>
<div class="tiles"><div class="tile"><div class="k">IP addresses</div><div class="v">3</div></div><div class="tile"><div class="k">Countries</div><div class="v">0</div></div><div class="tile"><div class="k">Unknown</div><div class="v">3</div></div></div>
<table><thead><tr><th>IP address</th><th>Country</th><th>Logins</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>
${[['34','192.0.2','2024-01-01','2024-01-23'],['2','198.51.100','2024-01-12','2024-01-15'],['1','203.0.113','2024-01-18','2024-01-18']].map(r=>`<tr><td class="ip" data-p="${r[1]}">${r[1]}.xxx</td><td><span class="chip">Unknown</span></td><td>${r[0]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>
<div style="margin-top:14px"><button class="btn primary" onclick="toast('Would download ~12 MB city file')">Load city-level detail (~12 MB)</button> <span class="note">Nothing from your export is sent.</span></div>`;
function ipToggle(b){const s=b.textContent.startsWith('Show');document.querySelectorAll('.ip').forEach(c=>c.textContent=c.dataset.p+(s?'.17':'.xxx'));b.textContent=s?'Hide full IP addresses':'Show full IP addresses'}
const spend=()=>`<div class="tiles" style="grid-template-columns:1fr 1fr 1fr"><div class="tile"><div class="k">USD spent</div><div class="v">9.99</div></div><div class="tile"><div class="k">Paid orders</div><div class="v">1</div></div><div class="tile"><div class="k">Failed / new</div><div class="v">0 / 0</div></div></div><p class="note">Each currency has its own total: nothing is converted or added across currencies.</p>`;
const vehicles=()=>`<div style="display:flex;gap:10px;margin-bottom:12px"><select><option>WoT</option></select><input class="search" placeholder="Search vehicles"></div><p class="note">WoT is not in this export.</p>`;
const NAV=[['Playtime & logins','on'],['Vehicles',''],['Finance','off'],['Payments',''],['Account','']];
const ident=`<div class="avatar">T</div><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div>`;
const actions=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="toast('Start over?')">Start over</button><button class="btn" onclick="toast('Cache cleared')">Clear cached data</button></div>`;
const secs={play:`<div class="card wide c12"><h2>Playtime</h2><div class="sub">When and how long you played</div>${server()}${tiles()}</div>`};
function polar(){const cx=250,cy=250,r0=70,w=24,gap=3;let o='';
for(let d=0;d<7;d++){const ri=r0+d*(w+gap),ro=ri+w;for(let h=0;h<24;h++){const a0=(h/24)*2*Math.PI-Math.PI/2+.012,a1=((h+1)/24)*2*Math.PI-Math.PI/2-.012;const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const [x0,y0]=p(ro,a0),[x1,y1]=p(ro,a1),[x2,y2]=p(ri,a1),[x3,y3]=p(ri,a0);
o+=`<path d="M${x0},${y0} A${ro},${ro} 0 0 1 ${x1},${y1} L${x2},${y2} A${ri},${ri} 0 0 0 ${x3},${y3}Z" fill="var(--r${hours[d*24+h]})"><title>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][d]} ${h}:00</title></path>`}}
let lab='';[0,6,12,18].forEach(h=>{const a=(h/24)*2*Math.PI-Math.PI/2;lab+=`<text x="${cx+(r0+7*(w+gap)+14)*Math.cos(a)}" y="${cy+(r0+7*(w+gap)+14)*Math.sin(a)+4}" fill="var(--muted)" font-size="12" text-anchor="middle">${String(h).padStart(2,'0')}:00</text>`});
return `<svg viewBox="0 0 500 500" role="img" aria-label="24-hour clock heatmap, rings are weekdays">${o}${lab}</svg>`}
function R1(){return `<div class="app t-polar r1"><div class="wrap"><div class="hd"><h1>Tester <span class="muted" style="font-weight:400;font-size:14px">123456789 · EU</span></h1>${actions}</div>
<div class="clock">${polar()}<div class="ctr"><b>31.2h</b><span class="muted">30 sessions<br>rings: Mon (inner) to Sun</span></div></div>
<div class="side"><div class="card">${server()}${tiles()}</div><div class="card"><h2>Hours per day</h2>${cal()}${legend()}</div><div class="card"><h2>Session length</h2>${bars()}</div></div>
<div class="card full"><h2>Login history</h2>${login()}</div><div class="card"><h2>Vehicles</h2>${vehicles()}</div><div class="card"><h2>Payments</h2>${spend()}</div></div></div>`}
function R2(){const ln=(a,b)=>`<div class="ln"><span>${a}</span><span>${b}</span></div>`;
return `<div class="app t-rcpt r2"><div class="paper"><div class="c"><h1>WG Data Export</h1><div class="muted">Customer: Tester · 123456789 · EU</div><div class="muted">Imported 2026-10-07 · 0 network calls</div></div><hr class="sep">
<div class="sec">Playtime</div>${ln('Sessions','30')}${ln('Active days','21')}${ln('Excluded rows','1')}<div class="ln tot"><span>TOTAL HOURS</span><span>31.2</span></div>${server()}
<div class="sec">Hours per day</div>${cal()}${legend()}<div class="sec">Weekday x hour</div>${hr()}${legend()}<div class="sec">Session length</div>${bars()}
<hr class="sep"><div class="sec">Login history</div>${ln('IP addresses','3')}${ln('Logins','37')}${ln('Countries','0')}${login()}
<hr class="sep"><div class="sec">Payments</div>${ln('Paid orders','1')}<div class="ln tot"><span>TOTAL USD</span><span>9.99</span></div>
<div class="c" style="margin-top:14px">${actions}</div><div class="c muted" style="margin-top:14px">THANK YOU FOR PLAYING</div><div class="barcode"></div></div></div>`}
function vw(el,id,k){const db=el.closest('.db');db.querySelectorAll('.vt a').forEach(a=>a.classList.toggle('on',a===el));db.querySelectorAll('.vw').forEach(v=>v.classList.toggle('on',v.dataset.k===k))}
function R3(){const db=(t,chips,table,chart)=>`<div class="db"><div class="hdr"><h2>${t}</h2><div class="vt"><a class="on" onclick="vw(this,0,'t')">▦ Table</a><a onclick="vw(this,0,'c')">▮ Chart</a></div><div class="chips">${chips.map(c=>`<span>${c}</span>`).join('')}</div></div><div class="vw on" data-k="t">${table}</div><div class="vw" data-k="c">${chart}</div></div>`;
const mt=`<table><thead><tr><th>Month</th><th>Sessions</th><th>Hours</th></tr></thead><tbody>${M.map((m,i)=>`<tr><td>${m} 2024</td><td>${Math.round(mh[i]*1.5)}</td><td>${mh[i]}</td></tr>`).join('')}</tbody></table>`;
return `<div class="app t-dbv r3"><div class="top"><span>📊</span><b>WG Export</b><span class="muted">/ Tester</span><span style="margin-left:auto">${actions}</span></div><div class="pg"><h1>Tester</h1>
<div class="props"><span>Account</span><b>123456789</b><span>Region</span><b>EU</b><span>Created</span><b>2024-01-01</b><span>Imported</span><b>2026-10-07</b></div>
${db('Playtime',['Server: All','1 excluded'],server()+tiles()+mt,cal()+legend()+hr()+legend())}
${db('Session length',['30 sessions'],'<table><thead><tr><th>Range</th><th>Sessions</th><th>Share</th></tr></thead><tbody><tr><td>20-30 min</td><td>5</td><td>17%</td></tr><tr><td>30-60 min</td><td>9</td><td>30%</td></tr><tr><td>1-2 hours</td><td>16</td><td>53%</td></tr></tbody></table>',bars())}
${db('Logins',['3 IPs','masked'],login(),'<p class="note">Country map appears here once matched.</p>')}
${db('Payments',['USD'],spend(),spend())}</div></div>`}
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const mh=[8.4,6.1,4.0,3.2,2.6,1.9,1.4,1.0,0.7,0.9,0.6,0.4];

const R={r1:R1,r2:R2,r3:R3};
function show(v){$('#root').innerHTML=R[v]();document.querySelectorAll('.variant-tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));if(window.after)after(v)}
document.querySelectorAll('.variant-tab').forEach(t=>t.onclick=()=>show(t.dataset.v));
show('r1');
</script></body></html>
