<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 006 - Clean light variations</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding-top:48px;font-family:system-ui,sans-serif}
#variant-nav{position:fixed;top:0;left:0;right:0;z-index:9998;background:#fff;border-bottom:1px solid #e5e5e5;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
.variant-tab{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.variant-tab:hover{background:#f0f0f0}.variant-tab.active{background:#111;color:#fff;border-color:#111}
#sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font:12px system-ui;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:8px;opacity:.4;transition:opacity .2s;display:flex;gap:6px;align-items:center}
#sketch-tools:hover{opacity:1}#sketch-tools button{font:inherit;cursor:pointer}
#frame{margin:0 auto;transition:max-width .2s}

/* shared page */
.app{background:var(--bg);color:var(--text);font-family:var(--font);min-height:calc(100vh - 48px);font-size:14px;line-height:1.5}
.app h1,.app h2,.app h3{font-family:var(--head);margin:0}
.muted{color:var(--muted)}
.btn{font:inherit;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 14px;cursor:pointer;transition:all .15s ease}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
select,input.search{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface2);border-radius:calc(var(--radius) - 2px);padding:14px 16px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:30px;font-weight:var(--numw);font-family:var(--head);line-height:1.2}
.tile .v small{font-size:13px;color:var(--muted);font-weight:400}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin:10px 0}
.hm i{aspect-ratio:1;border-radius:2px;min-width:8px}
.hh{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin:10px 0}
.hh i{height:16px;border-radius:2px}
.legend{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
.legend i{width:14px;height:14px;border-radius:2px}
.bars div{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;font-size:12px;color:var(--muted);padding:2px 0}
.bars b{display:block;height:10px;border-radius:5px;background:var(--r4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:9px 6px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:60ch}
.stat-row{display:flex;gap:6px;align-items:baseline}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* B1: sidebar clean */
.b1{display:grid;grid-template-columns:232px 1fr}
.b1 aside{background:#fff;border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:48px;height:calc(100vh - 48px);display:flex;flex-direction:column;gap:4px}
.b1 aside .brand{font-weight:700;margin:2px 10px 16px;display:flex;gap:8px;align-items:center}.b1 aside .brand:before{content:"";width:18px;height:18px;border-radius:5px;background:var(--primary)}
.nv a,.b1 .nvi{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer;transition:all .12s}
.nv a:hover{background:var(--surface2);color:var(--text)}.nv a.on{background:#eaf1ff;color:var(--primary);font-weight:600}.nv a small{color:var(--muted);font-weight:400}
.b1 .ph{padding:22px 28px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.b1 .ph h1{font-size:22px}.b1 .tabs{display:flex;gap:22px;padding:0 28px;border-bottom:1px solid var(--border);margin-top:14px}
.b1 .tabs a{padding:10px 0;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}.b1 .tabs a.on{color:var(--text);border-color:var(--primary);font-weight:600}
.b1 main{padding:22px 28px;display:grid;gap:16px;min-width:0}
.b1 .strip{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
.b1 .strip>div{padding:16px 18px;border-right:1px solid var(--border)}.b1 .strip>div:last-child{border:0}
.b1 .strip .k{color:var(--muted);font-size:12px}.b1 .strip .v{font-size:26px;font-weight:650;margin-top:2px}
.b1 .spk{height:22px;display:flex;align-items:flex-end;gap:2px;margin-top:6px}.b1 .spk i{flex:1;background:var(--r2);border-radius:1px}
.b1 .two{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.b1 .card{padding:18px}
/* B2: docs-like with TOC */
.b2 .top{position:sticky;top:48px;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 28px;display:flex;gap:18px;align-items:center}
.b2 .top .brand{font-weight:700}.b2 .lay{max-width:1240px;margin:0 auto;padding:24px 28px;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:34px}
.b2 .toc{position:sticky;top:120px;align-self:start;font-size:13px;border-left:1px solid var(--border);padding-left:14px;display:grid;gap:2px}
.b2 .toc .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.b2 .toc a{color:var(--muted);cursor:pointer;padding:3px 0;transition:color .12s}.b2 .toc a:hover{color:var(--text)}.b2 .toc a.on{color:var(--primary);font-weight:600}
.b2 .content{display:grid;gap:18px;min-width:0}.b2 .hero{display:flex;gap:14px;align-items:center}.b2 .hero h1{font-size:30px;letter-spacing:-.02em}
.b2 .big{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:0;background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.b2 .big>div{padding:22px;border-right:1px solid var(--border)}.b2 .big>div:last-child{border:0}
.b2 .big .v{font-size:44px;font-weight:700;letter-spacing:-.03em}.b2 .big .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.b2 .card{padding:22px}.b2 .card h2{font-size:18px}
/* B3: accordion soft */
.b3 .hd{background:linear-gradient(120deg,#0f8b8d,#2aa6a0 60%,#58c1b6);color:#fff;padding:30px 28px 70px}
.b3 .hd .row{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.b3 .hd h1{font-size:30px}.b3 .hd .muted{color:rgba(255,255,255,.8)}.b3 .hd .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
.b3 main{max-width:1000px;margin:-44px auto 0;padding:0 24px 50px;display:grid;gap:14px}
.b3 .sec{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.b3 .sec>button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:14px;align-items:center;padding:18px 22px;cursor:pointer;transition:background .15s}
.b3 .sec>button:hover{background:var(--surface2)}
.b3 .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface2)}
.b3 .sec h2{font-size:17px}.b3 .sec .sum{margin-left:auto;color:var(--primary);font-weight:700;font-size:20px;white-space:nowrap}.b3 .sec .chev{color:var(--muted);transition:transform .2s;margin-left:10px}
.b3 .sec.open .chev{transform:rotate(180deg)}.b3 .body{display:none;padding:4px 22px 22px}.b3 .body>*{margin-bottom:16px}.b3 .sec.open .body{display:block}
@media(max-width:700px){.b1{grid-template-columns:1fr}.b1 aside{display:none}.b1 .strip{grid-template-columns:1fr 1fr}.b1 .two{grid-template-columns:1fr}.b2 .lay{grid-template-columns:1fr;padding:14px}.b2 .toc{display:none}.b2 .big{grid-template-columns:1fr 1fr}.b3 .sec .sum{display:none}}

@media(max-width:700px){.tile .v{font-size:22px}}
</style></head><body>
<div id="variant-nav"><button class="variant-tab active" data-v="b1">B1: Sidebar + KPI strip</button><button class="variant-tab" data-v="b2">B2: Docs-style + on-this-page</button><button class="variant-tab" data-v="b3">B3: Accordion sections</button><span style="margin-left:auto;color:#888;align-self:center;font-size:12px">B2: click the right-hand TOC; B3: expand sections</span></div>
<div id="frame"><div id="root"></div></div>
<div id="sketch-tools"><button onclick="vp('100%')">Desktop</button><button onclick="vp('768px')">Tablet</button><button onclick="vp('375px')">Phone</button></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
function vp(w){$('#frame').style.maxWidth=w}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const days=[...Array(53*7)].map((_,i)=>{const r=rnd();return i>300?0:r<.45?0:Math.min(5,1+Math.floor(r*5.5))});
const hours=[...Array(7*24)].map((_,i)=>{const h=i%24;const peak=(h>=18&&h<=22)?1:(h>=9&&h<=11?.5:0);const r=rnd();return r<.15+(1-peak)*.6?0:Math.min(5,Math.ceil(r*5*Math.max(peak,.3)))});
const lv=l=>`background:var(--r${l})`;
const cal=()=>`<div class="hm">${days.map(l=>`<i style="${lv(l)}" title="level ${l}"></i>`).join('')}</div>`;
const hr=()=>`<div class="hh">${hours.map(l=>`<i style="${lv(l)}"></i>`).join('')}</div>`;
const legend=()=>`<div class="legend">Less ${[0,1,2,3,4,5].map(l=>`<i style="${lv(l)}"></i>`).join('')} More</div>`;
const bars=()=>`<div class="bars">${[['< 1 min',0],['20-30 min',30],['30-60 min',55],['1-2 hours',100],['2-4 hours',22]].map(([n,w])=>`<div><span>${n}</span><b style="width:${w}%;opacity:${w?1:.15}"></b><span>${w?Math.round(w/2.3):0}</span></div>`).join('')}</div>`;
const tiles=()=>`<div class="tiles"><div class="tile"><div class="k">Total playtime</div><div class="v">31.2 <small>hours</small></div></div><div class="tile"><div class="k">Sessions</div><div class="v">30</div></div><div class="tile"><div class="k">Active days</div><div class="v">21</div></div></div>`;
const server=()=>`<div style="display:flex;gap:10px;margin-bottom:14px"><select onchange="toast('Server: '+this.value)"><option>All servers</option><option>EU1</option><option>EU2</option><option>NA1</option></select><span class="chip" style="align-self:center">1 session excluded</span></div>`;
const login=()=>`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><span class="note">IP addresses are masked. The last part of each one is hidden.</span><button class="btn" id="ipbtn" onclick="ipToggle(this)">Show full IP addresses</button></div>
<div class="tiles"><div class="tile"><div class="k">IP addresses</div><div class="v">3</div></div><div class="tile"><div class="k">Countries</div><div class="v">0</div></div><div class="tile"><div class="k">Unknown</div><div class="v">3</div></div></div>
<table><thead><tr><th>IP address</th><th>Country</th><th>Logins</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>
${[['34','192.0.2','2024-01-01','2024-01-23'],['2','198.51.100','2024-01-12','2024-01-15'],['1','203.0.113','2024-01-18','2024-01-18']].map(r=>`<tr><td class="ip" data-p="${r[1]}">${r[1]}.xxx</td><td><span class="chip">Unknown</span></td><td>${r[0]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>
<div style="margin-top:14px"><button class="btn primary" onclick="toast('Would download ~12 MB city file')">Load city-level detail (~12 MB)</button> <span class="note">Nothing from your export is sent.</span></div>`;
function ipToggle(b){const s=b.textContent.startsWith('Show');document.querySelectorAll('.ip').forEach(c=>c.textContent=c.dataset.p+(s?'.17':'.xxx'));b.textContent=s?'Hide full IP addresses':'Show full IP addresses'}
const spend=()=>`<div class="tiles" style="grid-template-columns:1fr 1fr 1fr"><div class="tile"><div class="k">USD spent</div><div class="v">9.99</div></div><div class="tile"><div class="k">Paid orders</div><div class="v">1</div></div><div class="tile"><div class="k">Failed / new</div><div class="v">0 / 0</div></div></div><p class="note">Each currency has its own total: nothing is converted or added across currencies.</p>`;
const vehicles=()=>`<div style="display:flex;gap:10px;margin-bottom:12px"><select><option>WoT</option></select><input class="search" placeholder="Search vehicles"></div><p class="note">WoT is not in this export.</p>`;
const NAV=[['Playtime & logins','on'],['Vehicles',''],['Finance','off'],['Payments',''],['Account','']];
const ident=`<div class="avatar">T</div><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div>`;
const actions=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="toast('Start over?')">Start over</button><button class="btn" onclick="toast('Cache cleared')">Clear cached data</button></div>`;
const secs={play:`<div class="card wide c12"><h2>Playtime</h2><div class="sub">When and how long you played</div>${server()}${tiles()}</div>`};
const nv=(a)=>`<div class="nv">${NAV.map(([n,c])=>`<a class="${c==='on'?'on':''}" onclick="navClick(this)">${n}${n==='Finance'?'<small>n/a</small>':''}</a>`).join('')}</div>`;
function B1(){return `<div class="app t-cl b1"><aside><div class="brand">WG Export</div>${nv()}<div style="margin-top:auto" class="note">Imported Oct 7, 2026<br>Data stays on your machine.</div></aside><div>
<div class="ph"><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div>${actions}</div>
<div class="tabs"><a class="on" onclick="navClick(this)">Overview</a><a onclick="navClick(this)">Activity</a><a onclick="navClick(this)">Logins</a><a onclick="navClick(this)">Payments</a></div>
<main><div class="strip"><div><div class="k">Total playtime</div><div class="v">31.2 h</div><div class="spk">${[30,45,20,60,80,55,90,40,70,100].map(h=>`<i style="height:${h}%"></i>`).join('')}</div></div><div><div class="k">Sessions</div><div class="v">30</div></div><div><div class="k">Active days</div><div class="v">21</div></div><div><div class="k">Login IPs</div><div class="v">3</div></div></div>
<div class="two"><div class="card"><h2>Hours per day</h2><div class="sub">2024</div>${cal()}${legend()}</div><div class="card"><h2>Session length</h2><div class="sub">Mostly 1-2h</div>${bars()}</div></div>
<div class="card"><h2>Weekday & time of day</h2><div class="sub">Hours as recorded</div>${hr()}${legend()}</div>
<div class="card"><h2>Login history</h2><div class="sub">3 addresses · 37 logins</div>${login()}</div></main></div></div>`}
function B2(){const toc=['Overview','Hours per day','Weekday & time','Session length','Login history','Payments'];
return `<div class="app t-cl2 b2"><div class="top"><span class="brand">WG Export Viewer</span><div class="muted">Tester</div><span style="margin-left:auto">${actions}</span></div><div class="lay"><div class="content">
<div class="hero"><div class="avatar">T</div><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div></div>
<div class="big"><div><div class="k">Total playtime</div><div class="v">31.2<span style="font-size:18px;color:var(--muted)"> h</span></div>${server()}</div><div><div class="k">Sessions</div><div class="v">30</div></div><div><div class="k">Active days</div><div class="v">21</div></div><div><div class="k">USD spent</div><div class="v">9.99</div></div></div>
<div class="card" id="t1"><h2>Hours per day</h2><div class="sub">2024</div>${cal()}${legend()}</div>
<div class="card" id="t2"><h2>Weekday & time of day</h2><div class="sub">Hours as recorded in the export</div>${hr()}${legend()}</div>
<div class="card" id="t3"><h2>Session length</h2><div class="sub">Each bar covers a longer range</div>${bars()}</div>
<div class="card" id="t4"><h2>Login history</h2><div class="sub">3 addresses</div>${login()}</div>
<div class="card" id="t5"><h2>Payments</h2><div class="sub">Real-money spend</div>${spend()}</div></div>
<nav class="toc"><div class="h">On this page</div>${toc.map((t,i)=>`<a class="${i?'':'on'}" onclick="tocGo(this,${i})">${t}</a>`).join('')}</nav></div></div>`}
function tocGo(el,i){el.parentElement.querySelectorAll('a').forEach(a=>a.classList.remove('on'));el.classList.add('on');const ids=['t1','t1','t2','t3','t4','t5'];const e=document.getElementById(ids[i]);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
function acc(b){b.parentElement.classList.toggle('open')}
function B3(){const sec=(ico,t,sum,body,open)=>`<div class="sec ${open?'open':''}"><button onclick="acc(this)"><span class="ico">${ico}</span><h2>${t}</h2><span class="sum">${sum}</span><span class="chev">⌄</span></button><div class="body">${body}</div></div>`;
return `<div class="app t-cl3 b3"><div class="hd"><div class="row"><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div>${actions}</div></div><main>
${sec('⏱','Playtime','31.2 h',server()+tiles()+cal()+legend()+hr()+legend()+bars(),true)}
${sec('🌍','Login history','3 IPs',login())}
${sec('🛡','Vehicles','not in export',vehicles())}
${sec('💳','Payments','USD 9.99',spend())}</main></div>`}

const R={b1:B1,b2:B2,b3:B3};
function show(v){$('#root').innerHTML=R[v]();document.querySelectorAll('.variant-tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));if(window.after)after(v)}
document.querySelectorAll('.variant-tab').forEach(t=>t.onclick=()=>show(t.dataset.v));
show('b1');
</script></body></html>
