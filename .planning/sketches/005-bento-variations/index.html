<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 005 - Bento variations</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding-top:48px;font-family:system-ui,sans-serif}
#variant-nav{position:fixed;top:0;left:0;right:0;z-index:9998;background:#fff;border-bottom:1px solid #e5e5e5;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
.variant-tab{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.variant-tab:hover{background:#f0f0f0}.variant-tab.active{background:#111;color:#fff;border-color:#111}
#sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font:12px system-ui;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:8px;opacity:.4;transition:opacity .2s;display:flex;gap:6px;align-items:center}
#sketch-tools:hover{opacity:1}#sketch-tools button{font:inherit;cursor:pointer}
#frame{margin:0 auto;transition:max-width .2s}

/* shared page */
.app{background:var(--bg);color:var(--text);font-family:var(--font);min-height:calc(100vh - 48px);font-size:14px;line-height:1.5}
.app h1,.app h2,.app h3{font-family:var(--head);margin:0}
.muted{color:var(--muted)}
.btn{font:inherit;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 14px;cursor:pointer;transition:all .15s ease}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
select,input.search{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface2);border-radius:calc(var(--radius) - 2px);padding:14px 16px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:30px;font-weight:var(--numw);font-family:var(--head);line-height:1.2}
.tile .v small{font-size:13px;color:var(--muted);font-weight:400}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin:10px 0}
.hm i{aspect-ratio:1;border-radius:2px;min-width:8px}
.hh{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin:10px 0}
.hh i{height:16px;border-radius:2px}
.legend{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
.legend i{width:14px;height:14px;border-radius:2px}
.bars div{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;font-size:12px;color:var(--muted);padding:2px 0}
.bars b{display:block;height:10px;border-radius:5px;background:var(--r4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:9px 6px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:60ch}
.stat-row{display:flex;gap:6px;align-items:baseline}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* M: pastel bento */
.m .bar{max-width:1200px;margin:0 auto;padding:26px 28px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.m .bar h1{font-size:34px;font-weight:700;letter-spacing:-.03em}
.m .pills{display:flex;gap:4px;background:#fff;border-radius:99px;padding:4px;overflow-x:auto}
.m .pills a{padding:7px 16px;border-radius:99px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.m .pills a:hover{color:var(--text)}.m .pills a.on{background:var(--text);color:#fff}
.m main{max-width:1200px;margin:0 auto;padding:22px 28px 40px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;grid-auto-rows:minmax(120px,auto)}
.m .card{border:0;padding:22px;border-radius:var(--radius);display:flex;flex-direction:column}
.m .s2{grid-column:span 2}.m .s3{grid-column:span 3}.m .s4{grid-column:span 4}.m .s6{grid-column:span 6}.m .r2{grid-row:span 2}
.m .t1{background:#dfe9d6}.m .t2{background:#fbdcc8}.m .t3{background:#e3dcf5}.m .t4{background:#f7ecbd}.m .t5{background:#d6e8f2}
.m .stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.65}
.m .stat .v{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:auto}
.m .stat .v small{font-size:18px;font-weight:500;opacity:.6;letter-spacing:0}
.m .stat .n{font-size:13px;opacity:.65;margin-top:6px}
.m .card h2{font-size:17px}.m .tile{background:var(--surface2)}
.m .hm i,.m .hh i{border-radius:3px}.m .chip{background:#fff}
.m .btn{border-radius:99px;background:#fff}.m .btn.primary{background:var(--text);color:#fff}
.m select,.m input.search{border-radius:99px;background:#fff}
/* N: amber bento, icon rail, expandable */
.n{display:grid;grid-template-columns:68px 1fr}
.n .rail{position:sticky;top:48px;height:calc(100vh - 48px);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0}
.n .rail .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#1a1000;display:grid;place-items:center;font-weight:900;margin-bottom:12px}
.n .rail a{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:19px;cursor:pointer;color:var(--muted);transition:all .15s;position:relative}
.n .rail a:hover{background:var(--surface2);color:var(--text)}.n .rail a.on{background:var(--surface2);box-shadow:inset 3px 0 0 var(--primary)}
.n .rail a:hover:after{content:attr(data-t);position:absolute;left:54px;background:#000;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:9}
.n .rail .sp{flex:1}
.n main{padding:20px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-content:start;min-width:0}
.n .top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.n .top h1{font-size:20px}
.n .card{padding:16px;border-radius:var(--radius);position:relative;cursor:zoom-in;transition:border-color .15s,transform .15s}
.n .card:hover{border-color:var(--primary)}
.n .card:after{content:"⤢";position:absolute;right:12px;top:10px;color:var(--muted);opacity:0;transition:opacity .15s}.n .card:hover:after{opacity:1}
.n .card h2{font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.n .card .sub{display:none}
.n .s2{grid-column:span 2}.n .s3{grid-column:span 3}.n .s4{grid-column:span 4}.n .s6{grid-column:span 6}
.n .kpi{display:flex;flex-direction:column;justify-content:space-between;min-height:110px}
.n .kpi .v{font-size:36px;font-weight:700;color:var(--primary);line-height:1}.n .kpi .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.n .spark{height:34px;display:flex;align-items:flex-end;gap:3px}.n .spark i{flex:1;background:var(--r3);border-radius:2px}
.n .hm{margin:8px 0 4px}
.n .exp{position:fixed;inset:48px 0 0 0;z-index:9000;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;padding:30px;overflow:auto}
.n .exp.on{display:block}
.n .exp .panel{max-width:960px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px;position:relative;color:var(--text)}
.n .exp .x{position:absolute;right:16px;top:14px}
.n .exp .card{cursor:default;border:0;padding:0;background:none}.n .exp .card:after{display:none}.n .exp .card .sub{display:block}
.n .exp .hm i{min-width:12px}
@media(max-width:700px){.m main,.n main{grid-template-columns:1fr 1fr;padding:12px}.m .s3,.m .s4,.m .s6,.n .s3,.n .s4,.n .s6{grid-column:span 2}.n{grid-template-columns:1fr}.n .rail{display:none}.m .stat .v{font-size:44px}}

@media(max-width:700px){.tile .v{font-size:22px}}
</style></head><body>
<div id="variant-nav"><button class="variant-tab active" data-v="m">D2: Pastel bento</button><button class="variant-tab" data-v="n">D3: Amber bento + rail + expand</button><span style="margin-left:auto;color:#888;align-self:center;font-size:12px">D3: click a tile to expand</span></div>
<div id="frame"><div id="root"></div></div>
<div id="sketch-tools"><button onclick="vp('100%')">Desktop</button><button onclick="vp('768px')">Tablet</button><button onclick="vp('375px')">Phone</button></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
function vp(w){$('#frame').style.maxWidth=w}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const days=[...Array(53*7)].map((_,i)=>{const r=rnd();return i>300?0:r<.45?0:Math.min(5,1+Math.floor(r*5.5))});
const hours=[...Array(7*24)].map((_,i)=>{const h=i%24;const peak=(h>=18&&h<=22)?1:(h>=9&&h<=11?.5:0);const r=rnd();return r<.15+(1-peak)*.6?0:Math.min(5,Math.ceil(r*5*Math.max(peak,.3)))});
const lv=l=>`background:var(--r${l})`;
const cal=()=>`<div class="hm">${days.map(l=>`<i style="${lv(l)}" title="level ${l}"></i>`).join('')}</div>`;
const hr=()=>`<div class="hh">${hours.map(l=>`<i style="${lv(l)}"></i>`).join('')}</div>`;
const legend=()=>`<div class="legend">Less ${[0,1,2,3,4,5].map(l=>`<i style="${lv(l)}"></i>`).join('')} More</div>`;
const bars=()=>`<div class="bars">${[['< 1 min',0],['20-30 min',30],['30-60 min',55],['1-2 hours',100],['2-4 hours',22]].map(([n,w])=>`<div><span>${n}</span><b style="width:${w}%;opacity:${w?1:.15}"></b><span>${w?Math.round(w/2.3):0}</span></div>`).join('')}</div>`;
const tiles=()=>`<div class="tiles"><div class="tile"><div class="k">Total playtime</div><div class="v">31.2 <small>hours</small></div></div><div class="tile"><div class="k">Sessions</div><div class="v">30</div></div><div class="tile"><div class="k">Active days</div><div class="v">21</div></div></div>`;
const server=()=>`<div style="display:flex;gap:10px;margin-bottom:14px"><select onchange="toast('Server: '+this.value)"><option>All servers</option><option>EU1</option><option>EU2</option><option>NA1</option></select><span class="chip" style="align-self:center">1 session excluded</span></div>`;
const login=()=>`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><span class="note">IP addresses are masked. The last part of each one is hidden.</span><button class="btn" id="ipbtn" onclick="ipToggle(this)">Show full IP addresses</button></div>
<div class="tiles"><div class="tile"><div class="k">IP addresses</div><div class="v">3</div></div><div class="tile"><div class="k">Countries</div><div class="v">0</div></div><div class="tile"><div class="k">Unknown</div><div class="v">3</div></div></div>
<table><thead><tr><th>IP address</th><th>Country</th><th>Logins</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>
${[['34','192.0.2','2024-01-01','2024-01-23'],['2','198.51.100','2024-01-12','2024-01-15'],['1','203.0.113','2024-01-18','2024-01-18']].map(r=>`<tr><td class="ip" data-p="${r[1]}">${r[1]}.xxx</td><td><span class="chip">Unknown</span></td><td>${r[0]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>
<div style="margin-top:14px"><button class="btn primary" onclick="toast('Would download ~12 MB city file')">Load city-level detail (~12 MB)</button> <span class="note">Nothing from your export is sent.</span></div>`;
function ipToggle(b){const s=b.textContent.startsWith('Show');document.querySelectorAll('.ip').forEach(c=>c.textContent=c.dataset.p+(s?'.17':'.xxx'));b.textContent=s?'Hide full IP addresses':'Show full IP addresses'}
const spend=()=>`<div class="tiles" style="grid-template-columns:1fr 1fr 1fr"><div class="tile"><div class="k">USD spent</div><div class="v">9.99</div></div><div class="tile"><div class="k">Paid orders</div><div class="v">1</div></div><div class="tile"><div class="k">Failed / new</div><div class="v">0 / 0</div></div></div><p class="note">Each currency has its own total: nothing is converted or added across currencies.</p>`;
const vehicles=()=>`<div style="display:flex;gap:10px;margin-bottom:12px"><select><option>WoT</option></select><input class="search" placeholder="Search vehicles"></div><p class="note">WoT is not in this export.</p>`;
const NAV=[['Playtime & logins','on'],['Vehicles',''],['Finance','off'],['Payments',''],['Account','']];
const ident=`<div class="avatar">T</div><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div>`;
const actions=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="toast('Start over?')">Start over</button><button class="btn" onclick="toast('Cache cleared')">Clear cached data</button></div>`;
const secs={play:`<div class="card wide c12"><h2>Playtime</h2><div class="sub">When and how long you played</div>${server()}${tiles()}</div>`};
const spark=(a)=>`<div class="spark">${a.map(h=>`<i style="height:${h}%"></i>`).join('')}</div>`;
function M(){return `<div class="app t-pastel m"><div class="bar"><h1>Hi, Tester 👋</h1><div class="pills">${NAV.map(([n,c])=>`<a class="${c==='on'?'on':''}" onclick="navClick(this)">${n}</a>`).join('')}</div>${actions}</div>
<main><div class="card stat t1 s2 r2"><div class="k">Total playtime</div><div class="v">31.2<small> hours</small></div><div class="n">across 30 sessions · 21 days</div><div style="margin-top:12px">${server()}</div></div>
<div class="card stat t2 s2"><div class="k">Sessions</div><div class="v">30</div></div>
<div class="card stat t3 s2"><div class="k">Active days</div><div class="v">21</div></div>
<div class="card stat t4 s2"><div class="k">Login IPs</div><div class="v">3</div><div class="n">37 logins</div></div>
<div class="card stat t5 s2"><div class="k">USD spent</div><div class="v">9.99</div><div class="n">1 paid order</div></div>
<div class="card s4"><h2>Hours per day</h2><div class="sub">2024</div>${cal()}${legend()}</div>
<div class="card s2 t3"><h2>Session length</h2><div class="sub">Mostly 1-2h</div>${bars()}</div>
<div class="card s6"><h2>Weekday & time of day</h2><div class="sub">Evenings dominate</div>${hr()}${legend()}</div>
<div class="card s6"><h2>Login history</h2><div class="sub">3 addresses · 37 logins</div>${login()}</div>
<div class="card s3 t2"><h2>Vehicles</h2>${vehicles()}</div><div class="card s3 t1"><h2>Payments</h2>${spend()}</div></main></div>`}
function N(){const ic=[['⏱','Playtime'],['🌍','Logins'],['🛡','Vehicles'],['💳','Payments']];
return `<div class="app t-amber n"><nav class="rail"><div class="logo">W</div>${ic.map(([i,t],k)=>`<a class="${k?'':'on'}" data-t="${t}" onclick="navClick(this)">${i}</a>`).join('')}<div class="sp"></div><a data-t="Start over" onclick="toast('Start over?')">↺</a></nav>
<main><div class="top"><h1>Tester <span class="muted" style="font-weight:400;font-size:13px">123456789 · EU · imported Oct 7, 2026</span></h1><div class="muted" style="font-size:12px">click any tile to expand</div></div>
<div class="card kpi s2"><div class="k">Playtime</div><div class="v">31.2h</div>${spark([30,45,20,60,80,55,90,40,70,100])}</div>
<div class="card kpi"><div class="k">Sessions</div><div class="v">30</div></div><div class="card kpi"><div class="k">Active days</div><div class="v">21</div></div>
<div class="card kpi"><div class="k">Login IPs</div><div class="v">3</div></div><div class="card kpi"><div class="k">USD spent</div><div class="v">9.99</div></div>
<div class="card s4"><h2>Hours per day</h2><div class="sub">2024 · rank-based shading</div>${cal()}${legend()}</div>
<div class="card s2"><h2>Session length</h2><div class="sub">Each bar covers a longer range</div>${bars()}</div>
<div class="card s3"><h2>Weekday & time</h2><div class="sub">Hours as recorded in the export</div>${hr()}${legend()}</div>
<div class="card s3"><h2>Login history</h2><div class="sub">3 addresses · 37 logins</div>${login()}</div>
</main><div class="exp" onclick="if(event.target===this)this.classList.remove('on')"><div class="panel"><button class="btn x" onclick="this.closest('.exp').classList.remove('on')">Close ✕</button><div id="expc"></div></div></div></div>`}
function after(v){if(v!=='n')return;document.querySelectorAll('.n main>.card').forEach(c=>c.onclick=e=>{if(e.target.closest('button,select,input,a'))return;$('#expc').innerHTML=c.outerHTML;$('.n .exp').classList.add('on')})}

const R={m:M,n:N};
function show(v){$('#root').innerHTML=R[v]();document.querySelectorAll('.variant-tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));if(window.after)after(v)}
document.querySelectorAll('.variant-tab').forEach(t=>t.onclick=()=>show(t.dataset.v));
show('m');
</script></body></html>
