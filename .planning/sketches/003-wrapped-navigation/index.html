<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 003 - Wrapped navigation</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding-top:48px;font-family:system-ui,sans-serif}
#variant-nav{position:fixed;top:0;left:0;right:0;z-index:9998;background:#fff;border-bottom:1px solid #e5e5e5;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
.variant-tab{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.variant-tab:hover{background:#f0f0f0}.variant-tab.active{background:#111;color:#fff;border-color:#111}
#sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font:12px system-ui;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:8px;opacity:.4;transition:opacity .2s;display:flex;gap:6px;align-items:center}
#sketch-tools:hover{opacity:1}#sketch-tools button{font:inherit;cursor:pointer}
#frame{margin:0 auto;transition:max-width .2s}

/* shared page */
.app{background:var(--bg);color:var(--text);font-family:var(--font);min-height:calc(100vh - 48px);font-size:14px;line-height:1.5}
.app h1,.app h2,.app h3{font-family:var(--head);margin:0}
.muted{color:var(--muted)}
.btn{font:inherit;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 14px;cursor:pointer;transition:all .15s ease}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
select,input.search{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface2);border-radius:calc(var(--radius) - 2px);padding:14px 16px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:30px;font-weight:var(--numw);font-family:var(--head);line-height:1.2}
.tile .v small{font-size:13px;color:var(--muted);font-weight:400}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin:10px 0}
.hm i{aspect-ratio:1;border-radius:2px;min-width:8px}
.hh{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin:10px 0}
.hh i{height:16px;border-radius:2px}
.legend{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
.legend i{width:14px;height:14px;border-radius:2px}
.bars div{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;font-size:12px;color:var(--muted);padding:2px 0}
.bars b{display:block;height:10px;border-radius:5px;background:var(--r4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:9px 6px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:60ch}
.stat-row{display:flex;gap:6px;align-items:baseline}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* shared wrapped */
.w{background:var(--bg)}
.w .snap{height:calc(100vh - 48px);overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.w .panel{min-height:calc(100vh - 48px);scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:90px 24px;position:relative}
.w .panel:nth-child(1){background:radial-gradient(circle at 30% 20%,#5b3fa8,#1a1033 60%)}
.w .panel:nth-child(2){background:linear-gradient(160deg,#2a1450,#4a1d6e)}
.w .panel:nth-child(3){background:linear-gradient(160deg,#4a1d6e,#6a1f78)}
.w .panel:nth-child(4){background:linear-gradient(160deg,#6a1f78,#8a2070)}
.w .panel:nth-child(5){background:linear-gradient(160deg,#8a2070,#a8205f)}
.w .panel:nth-child(6){background:linear-gradient(160deg,#a8205f,#1a1033)}
.w .kick{letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.w .huge{font-size:clamp(64px,14vw,160px);font-weight:900;line-height:.95;letter-spacing:-.05em;color:var(--primary);margin:10px 0}
.w .line{font-size:clamp(18px,3vw,26px);font-weight:700;max-width:24ch}
.w .inner{width:100%;max-width:820px;margin-top:26px;text-align:left}
.w .tile .v{color:var(--primary)}
.w .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.w .btn.primary{background:var(--primary);color:#1a1033;border-color:var(--primary)}
.w table{background:rgba(0,0,0,.2);border-radius:16px}
.w .card{background:transparent;border:0;padding:0;box-shadow:none}
.w .pos{position:fixed;z-index:60}
.w .snap{position:relative}
.nv{cursor:pointer;transition:all .15s ease;color:#fff}
/* G: dot rail with labels + progress bar + keys */
.g .rail{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:14px}
.g .rail a{display:flex;align-items:center;gap:10px;cursor:pointer;color:transparent;font-size:12px;font-weight:600;transition:all .2s}
.g .rail a i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);transition:all .2s;flex:none}
.g .rail:hover a{color:#fff}
.g .rail a:hover i{background:#fff}.g .rail a.on i{background:var(--primary);transform:scale(1.5);box-shadow:0 0 10px var(--primary)}
.g .rail a.on{color:var(--primary)}
.g .prog{position:fixed;top:48px;left:0;height:4px;background:var(--primary);z-index:61;transition:width .25s;width:0}
.g .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;font-size:12px;color:var(--muted);background:rgba(0,0,0,.35);padding:5px 12px;border-radius:99px}
/* H: story segments + chapter bar + arrows */
.h .seg{position:fixed;top:48px;left:0;right:0;z-index:61;display:flex;gap:4px;padding:10px 16px 0}
.h .seg a{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25);cursor:pointer;overflow:hidden;transition:transform .15s}
.h .seg a:hover{transform:scaleY(1.8)}
.h .seg a b{display:block;height:100%;width:0;background:#fff;transition:width .3s}
.h .seg a.done b,.h .seg a.on b{width:100%}
.h .seg a.on b{background:var(--primary)}
.h .chap{position:fixed;top:68px;left:0;right:0;z-index:61;display:flex;justify-content:space-between;align-items:center;padding:6px 16px}
.h .chap .t{font-weight:700;font-size:13px}.h .chap .t span{color:var(--muted);font-weight:400}
.h .arrows{position:fixed;right:20px;bottom:20px;z-index:61;display:flex;gap:8px}
.h .arrows button{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;font-size:20px;cursor:pointer;transition:all .15s}
.h .arrows button:hover{background:var(--primary);color:#1a1033}
/* I: bottom dock + overview grid */
.i .dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:61;display:flex;gap:4px;background:rgba(20,10,40,.75);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:99px;padding:6px;max-width:calc(100vw - 24px);overflow-x:auto}
.i .dock a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 14px;border-radius:99px;cursor:pointer;color:var(--muted);font-size:11px;white-space:nowrap;transition:all .15s}
.i .dock a span{font-size:17px;line-height:1.1}
.i .dock a:hover{color:#fff;background:rgba(255,255,255,.1)}.i .dock a.on{background:var(--primary);color:#1a1033;font-weight:700}
.i .ov{position:fixed;inset:48px 0 0 0;z-index:70;background:rgba(15,8,30,.92);backdrop-filter:blur(10px);display:none;padding:40px 24px;overflow:auto}
.i .ov.on{display:block}
.i .ov h2{text-align:center;margin-bottom:24px}
.i .ovg{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.i .ovg a{border-radius:20px;padding:18px;cursor:pointer;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .15s;border:1px solid var(--border)}
.i .ovg a:hover{transform:translateY(-4px)}
.i .ovg b{font-size:34px;color:var(--primary);font-weight:900;letter-spacing:-.03em}
.i .ovg small{color:var(--muted)}
.i .grid-btn{position:fixed;top:62px;right:16px;z-index:61}
@media(max-width:700px){
 .i .ovg{grid-template-columns:1fr 1fr}.g .rail a span{display:none}.g .rail{left:8px}.w .panel{padding:90px 16px}.tiles{grid-template-columns:1fr 1fr 1fr}
 .tile .v{font-size:22px}
}
</style></head><body>
<div id="variant-nav">
 <button class="variant-tab active" data-v="g">G: Dot rail</button>
 <button class="variant-tab" data-v="h">H: Story segments</button>
 <button class="variant-tab" data-v="i">I: Dock + overview</button>
 <span style="margin-left:auto;color:#888;align-self:center;font-size:12px">Click nav, scroll, or use arrow keys / PageUp / PageDown.</span>
</div>
<div id="frame"><div id="root"></div></div>
<div id="sketch-tools">
 <button onclick="vp('100%')">Desktop</button><button onclick="vp('768px')">Tablet</button><button onclick="vp('375px')">Phone</button>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
function vp(w){$('#frame').style.maxWidth=w}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const days=[...Array(53*7)].map((_,i)=>{const r=rnd();return i>300?0:r<.45?0:Math.min(5,1+Math.floor(r*5.5))});
const hours=[...Array(7*24)].map((_,i)=>{const h=i%24;const peak=(h>=18&&h<=22)?1:(h>=9&&h<=11?.5:0);const r=rnd();return r<.15+(1-peak)*.6?0:Math.min(5,Math.ceil(r*5*Math.max(peak,.3)))});
const lv=l=>`background:var(--r${l})`;
const cal=()=>`<div class="hm">${days.map(l=>`<i style="${lv(l)}" title="level ${l}"></i>`).join('')}</div>`;
const hr=()=>`<div class="hh">${hours.map(l=>`<i style="${lv(l)}"></i>`).join('')}</div>`;
const legend=()=>`<div class="legend">Less ${[0,1,2,3,4,5].map(l=>`<i style="${lv(l)}"></i>`).join('')} More</div>`;
const bars=()=>`<div class="bars">${[['< 1 min',0],['20-30 min',30],['30-60 min',55],['1-2 hours',100],['2-4 hours',22]].map(([n,w])=>`<div><span>${n}</span><b style="width:${w}%;opacity:${w?1:.15}"></b><span>${w?Math.round(w/2.3):0}</span></div>`).join('')}</div>`;
const tiles=()=>`<div class="tiles"><div class="tile"><div class="k">Total playtime</div><div class="v">31.2 <small>hours</small></div></div><div class="tile"><div class="k">Sessions</div><div class="v">30</div></div><div class="tile"><div class="k">Active days</div><div class="v">21</div></div></div>`;
const server=()=>`<div style="display:flex;gap:10px;margin-bottom:14px"><select onchange="toast('Server: '+this.value)"><option>All servers</option><option>EU1</option><option>EU2</option><option>NA1</option></select><span class="chip" style="align-self:center">1 session excluded</span></div>`;
const login=()=>`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><span class="note">IP addresses are masked. The last part of each one is hidden.</span><button class="btn" id="ipbtn" onclick="ipToggle(this)">Show full IP addresses</button></div>
<div class="tiles"><div class="tile"><div class="k">IP addresses</div><div class="v">3</div></div><div class="tile"><div class="k">Countries</div><div class="v">0</div></div><div class="tile"><div class="k">Unknown</div><div class="v">3</div></div></div>
<table><thead><tr><th>IP address</th><th>Country</th><th>Logins</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>
${[['34','192.0.2','2024-01-01','2024-01-23'],['2','198.51.100','2024-01-12','2024-01-15'],['1','203.0.113','2024-01-18','2024-01-18']].map(r=>`<tr><td class="ip" data-p="${r[1]}">${r[1]}.xxx</td><td><span class="chip">Unknown</span></td><td>${r[0]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>
<div style="margin-top:14px"><button class="btn primary" onclick="toast('Would download ~12 MB city file')">Load city-level detail (~12 MB)</button> <span class="note">Nothing from your export is sent.</span></div>`;
function ipToggle(b){const s=b.textContent.startsWith('Show');document.querySelectorAll('.ip').forEach(c=>c.textContent=c.dataset.p+(s?'.17':'.xxx'));b.textContent=s?'Hide full IP addresses':'Show full IP addresses'}
const spend=()=>`<div class="tiles" style="grid-template-columns:1fr 1fr 1fr"><div class="tile"><div class="k">USD spent</div><div class="v">9.99</div></div><div class="tile"><div class="k">Paid orders</div><div class="v">1</div></div><div class="tile"><div class="k">Failed / new</div><div class="v">0 / 0</div></div></div><p class="note">Each currency has its own total: nothing is converted or added across currencies.</p>`;
const vehicles=()=>`<div style="display:flex;gap:10px;margin-bottom:12px"><select><option>WoT</option></select><input class="search" placeholder="Search vehicles"></div><p class="note">WoT is not in this export.</p>`;
const NAV=[['Playtime & logins','on'],['Vehicles',''],['Finance','off'],['Payments',''],['Account','']];
const ident=`<div class="avatar">T</div><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div>`;
const actions=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="toast('Start over?')">Start over</button><button class="btn" onclick="toast('Cache cleared')">Clear cached data</button></div>`;
const secs={play:`<div class="card wide c12"><h2>Playtime</h2><div class="sub">When and how long you played</div>${server()}${tiles()}</div>`};
const CH=[['Start','👋','Tester','Account 123456789 · EU'],['Playtime','⏱','31.2h','31 hours, 30 sessions'],['Rhythm','🕖','19:00','busiest hour'],['Sessions','🎯','1-2h','typical session'],['Logins','🌍','3 IPs','37 logins'],['Spend','💳','$9.99','1 paid order']];
function panels(){return `<section class="panel" id="p0"><div class="kick">Your Wargaming data export</div><div class="huge">Tester</div><div class="line">Account 123456789 · EU · since 2024</div><div style="margin-top:22px">${actions}</div></section>
<section class="panel" id="p1"><div class="kick">You played</div><div class="huge">31.2h</div><div class="line">across 30 sessions on 21 different days</div><div class="inner">${server()}</div></section>
<section class="panel" id="p2"><div class="kick">Your busiest hour</div><div class="huge">19:00</div><div class="line">Evenings and weekends are your battleground</div><div class="inner">${cal()}${hr()}${legend()}</div></section>
<section class="panel" id="p3"><div class="kick">Typical session</div><div class="huge">1-2h</div><div class="line">Over half your sessions run this long</div><div class="inner">${bars()}</div></section>
<section class="panel" id="p4"><div class="kick">You logged in from</div><div class="huge">3 IPs</div><div class="line">37 logins · 0 countries matched</div><div class="inner">${login()}</div></section>
<section class="panel" id="p5"><div class="kick">Real-money spend</div><div class="huge">$9.99</div><div class="line">1 paid order, 0 failed</div><div class="inner">${spend()}</div></section>`}
function go(i){i=Math.max(0,Math.min(CH.length-1,i));document.getElementById('p'+i).scrollIntoView({behavior:'smooth'});}
let cur=0;
function spy(){const sn=document.querySelector('.snap');if(!sn)return;const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.55){cur=+e.target.id.slice(1);paint()}}),{root:sn,threshold:.55});sn.querySelectorAll('.panel').forEach(p=>io.observe(p))}
function paint(){document.querySelectorAll('[data-i]').forEach(el=>{const i=+el.dataset.i;el.classList.toggle('on',i===cur);el.classList.toggle('done',i<cur)});const pr=$('.prog');if(pr)pr.style.width=((cur+1)/CH.length*100)+'%';const t=$('.chap .t');if(t)t.innerHTML=CH[cur][0]+' <span>'+(cur+1)+'/'+CH.length+'</span>'}
function G(){return `<div class="app t-wrap w g"><div class="prog"></div><nav class="rail">${CH.map((c,i)=>`<a data-i="${i}" onclick="go(${i})"><i></i><span>${c[0]}</span></a>`).join('')}</nav><div class="hint">↑ ↓ or click the dots</div><div class="snap">${panels()}</div></div>`}
function H(){return `<div class="app t-wrap w h"><div class="seg">${CH.map((c,i)=>`<a data-i="${i}" title="${c[0]}" onclick="go(${i})"><b></b></a>`).join('')}</div><div class="chap"><div class="t"></div><div class="muted" style="font-size:12px">tap a bar to jump</div></div><div class="arrows"><button onclick="go(cur-1)" title="Previous">↑</button><button onclick="go(cur+1)" title="Next">↓</button></div><div class="snap">${panels()}</div></div>`}
function I(){return `<div class="app t-wrap w i"><button class="btn grid-btn" onclick="document.querySelector('.ov').classList.add('on')">▦ Overview</button><div class="ov"><h2>Jump to a chapter</h2><div class="ovg">${CH.map((c,i)=>`<a data-i="${i}" style="background:${['#3a2a78','#4a1d6e','#6a1f78','#8a2070','#a8205f','#5b2a60'][i]}" onclick="go(${i});document.querySelector('.ov').classList.remove('on')"><small>${c[0]}</small><b>${c[2]}</b><small>${c[3]}</small></a>`).join('')}</div><p style="text-align:center;margin-top:20px"><button class="btn" onclick="document.querySelector('.ov').classList.remove('on')">Close</button></p></div><nav class="dock">${CH.map((c,i)=>`<a data-i="${i}" onclick="go(${i})"><span>${c[1]}</span>${c[0]}</a>`).join('')}</nav><div class="snap">${panels()}</div></div>`}
const R={g:G,h:H,i:I};
function show(v){cur=0;$('#root').innerHTML=R[v]();document.querySelectorAll('.variant-tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));spy();paint()}
document.querySelectorAll('.variant-tab').forEach(t=>t.onclick=()=>show(t.dataset.v));
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(['ArrowDown','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}});
show('g');
</script></body></html>
