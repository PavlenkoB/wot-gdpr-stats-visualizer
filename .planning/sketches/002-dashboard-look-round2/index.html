<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 002 - Dashboard look round 2</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding-top:48px;font-family:system-ui,sans-serif}
#variant-nav{position:fixed;top:0;left:0;right:0;z-index:9998;background:#fff;border-bottom:1px solid #e5e5e5;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
.variant-tab{border:1px solid #ccc;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.variant-tab:hover{background:#f0f0f0}.variant-tab.active{background:#111;color:#fff;border-color:#111}
#sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font:12px system-ui;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:8px;opacity:.4;transition:opacity .2s;display:flex;gap:6px;align-items:center}
#sketch-tools:hover{opacity:1}#sketch-tools button{font:inherit;cursor:pointer}
#frame{margin:0 auto;transition:max-width .2s}

/* shared page */
.app{background:var(--bg);color:var(--text);font-family:var(--font);min-height:calc(100vh - 48px);font-size:14px;line-height:1.5}
.app h1,.app h2,.app h3{font-family:var(--head);margin:0}
.muted{color:var(--muted)}
.btn{font:inherit;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 14px;cursor:pointer;transition:all .15s ease}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
select,input.search{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface2);border-radius:calc(var(--radius) - 2px);padding:14px 16px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:30px;font-weight:var(--numw);font-family:var(--head);line-height:1.2}
.tile .v small{font-size:13px;color:var(--muted);font-weight:400}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin:10px 0}
.hm i{aspect-ratio:1;border-radius:2px;min-width:8px}
.hh{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin:10px 0}
.hh i{height:16px;border-radius:2px}
.legend{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
.legend i{width:14px;height:14px;border-radius:2px}
.bars div{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;font-size:12px;color:var(--muted);padding:2px 0}
.bars b{display:block;height:10px;border-radius:5px;background:var(--r4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:9px 6px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:60ch}
.stat-row{display:flex;gap:6px;align-items:baseline}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* D: bento */
.d main{max-width:1200px;margin:0 auto;padding:28px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(130px,auto);gap:14px}
.d .bar{max-width:1200px;margin:0 auto;padding:22px 28px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.d .bar h1{font-size:22px;display:flex;gap:12px;align-items:center}
.d .pills{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:4px}
.d .pills a{padding:6px 14px}.d .pills a.on{background:var(--primary);color:#0b0d12}
.pills{display:flex;gap:4px;overflow-x:auto}.pills a{border-radius:99px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s ease}.pills a:hover{color:var(--text)}
.d .card{padding:18px;display:flex;flex-direction:column;border-radius:var(--radius)}
.d .s2{grid-column:span 2}.d .s4{grid-column:span 4}.d .r2{grid-row:span 2}
.d .big{background:linear-gradient(135deg,#3a2f8f,#14171f 70%);justify-content:flex-end}
.d .big .v{font-size:72px;font-weight:800;letter-spacing:-.04em;line-height:1}
.d .big .k{color:#cfc8ff;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.d .kpi .v{font-size:38px;font-weight:700;margin-top:auto}.d .kpi .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.d .kpi .delta{color:var(--accent);font-size:12px}
.d .tiles{margin-bottom:0}.d .card .tile{background:transparent;padding:0}
.d .card.scroll{overflow:auto}
/* E: wrapped */
.e{background:var(--bg)}
.e .snap{height:calc(100vh - 48px);overflow-y:auto;scroll-snap-type:y mandatory}
.e .panel{min-height:calc(100vh - 48px);scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 24px;position:relative}
.e .panel:nth-child(1){background:radial-gradient(circle at 30% 20%,#5b3fa8,#1a1033 60%)}
.e .panel:nth-child(2){background:linear-gradient(160deg,#2a1450,#4a1d6e)}
.e .panel:nth-child(3){background:linear-gradient(160deg,#4a1d6e,#7a1f78)}
.e .panel:nth-child(4){background:linear-gradient(160deg,#7a1f78,#a8205f)}
.e .panel:nth-child(5){background:linear-gradient(160deg,#a8205f,#1a1033)}
.e .kick{letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.e .huge{font-size:clamp(72px,16vw,180px);font-weight:900;line-height:.95;letter-spacing:-.05em;color:var(--primary);margin:10px 0}
.e .line{font-size:clamp(18px,3vw,28px);font-weight:700;max-width:22ch}
.e .inner{width:100%;max-width:820px;margin-top:26px;text-align:left}
.e .tile .v{color:var(--primary)}
.e .dots{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:50}
.e .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.e .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.e .btn.primary{background:var(--primary);color:#1a1033;border-color:var(--primary)}
.e table{background:rgba(0,0,0,.2);border-radius:16px}
.e .more{position:absolute;bottom:18px;color:var(--muted);font-size:12px}
/* F: tactical */
.f .hdr{background:var(--surface);border-bottom:3px solid var(--primary);padding:14px 28px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.f .hdr h1{font-size:30px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.f .hdr .id{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.f .tabs{display:flex;background:var(--surface2);border-bottom:1px solid var(--border);overflow-x:auto}
.f .tabs a{padding:12px 22px;font-family:var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;border-right:1px solid var(--border);transition:all .15s ease}
.f .tabs a:hover{color:var(--text);background:var(--surface)}
.f .tabs a.on{background:var(--primary);color:#1c1f17}.f .tabs a.off{opacity:.4}
.f main{max-width:1100px;margin:0 auto;padding:24px 28px;display:grid;gap:14px}
.f .two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.f .card{border-left:4px solid var(--primary);background:var(--surface)}
.f .card h2{font-family:var(--head);font-weight:400;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.f .tile{border:1px solid var(--border);background:var(--surface2)}
.f .tile .v{font-family:var(--head);font-size:40px;color:var(--primary);letter-spacing:.03em}
.f .btn{border-radius:3px;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.f .btn.primary{background:var(--primary);color:#1c1f17;border-color:var(--primary)}
.f select,.f input.search{border-radius:3px}
.f .pane{display:none;gap:14px}.f .pane.on{display:grid}
@media(max-width:700px){
 .d main{grid-template-columns:1fr 1fr;padding:14px}.d .s2,.d .s4{grid-column:span 2}.f .two{grid-template-columns:1fr}.f main{padding:14px}.tiles{grid-template-columns:1fr 1fr 1fr}
 .tile .v{font-size:22px}
}
</style></head><body>
<div id="variant-nav">
 <button class="variant-tab active" data-v="d">D: Bento</button>
 <button class="variant-tab" data-v="e">E: Wrapped Story</button>
 <button class="variant-tab" data-v="f">F: Tactical Briefing</button>
 <span style="margin-left:auto;color:#888;align-self:center;font-size:12px">F: click the tabs. E: scroll.</span>
</div>
<div id="frame"><div id="root"></div></div>
<div id="sketch-tools">
 <button onclick="vp('100%')">Desktop</button><button onclick="vp('768px')">Tablet</button><button onclick="vp('375px')">Phone</button>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
function vp(w){$('#frame').style.maxWidth=w}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const days=[...Array(53*7)].map((_,i)=>{const r=rnd();return i>300?0:r<.45?0:Math.min(5,1+Math.floor(r*5.5))});
const hours=[...Array(7*24)].map((_,i)=>{const h=i%24;const peak=(h>=18&&h<=22)?1:(h>=9&&h<=11?.5:0);const r=rnd();return r<.15+(1-peak)*.6?0:Math.min(5,Math.ceil(r*5*Math.max(peak,.3)))});
const lv=l=>`background:var(--r${l})`;
const cal=()=>`<div class="hm">${days.map(l=>`<i style="${lv(l)}" title="level ${l}"></i>`).join('')}</div>`;
const hr=()=>`<div class="hh">${hours.map(l=>`<i style="${lv(l)}"></i>`).join('')}</div>`;
const legend=()=>`<div class="legend">Less ${[0,1,2,3,4,5].map(l=>`<i style="${lv(l)}"></i>`).join('')} More</div>`;
const bars=()=>`<div class="bars">${[['< 1 min',0],['20-30 min',30],['30-60 min',55],['1-2 hours',100],['2-4 hours',22]].map(([n,w])=>`<div><span>${n}</span><b style="width:${w}%;opacity:${w?1:.15}"></b><span>${w?Math.round(w/2.3):0}</span></div>`).join('')}</div>`;
const tiles=()=>`<div class="tiles"><div class="tile"><div class="k">Total playtime</div><div class="v">31.2 <small>hours</small></div></div><div class="tile"><div class="k">Sessions</div><div class="v">30</div></div><div class="tile"><div class="k">Active days</div><div class="v">21</div></div></div>`;
const server=()=>`<div style="display:flex;gap:10px;margin-bottom:14px"><select onchange="toast('Server: '+this.value)"><option>All servers</option><option>EU1</option><option>EU2</option><option>NA1</option></select><span class="chip" style="align-self:center">1 session excluded</span></div>`;
const login=()=>`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><span class="note">IP addresses are masked. The last part of each one is hidden.</span><button class="btn" id="ipbtn" onclick="ipToggle(this)">Show full IP addresses</button></div>
<div class="tiles"><div class="tile"><div class="k">IP addresses</div><div class="v">3</div></div><div class="tile"><div class="k">Countries</div><div class="v">0</div></div><div class="tile"><div class="k">Unknown</div><div class="v">3</div></div></div>
<table><thead><tr><th>IP address</th><th>Country</th><th>Logins</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>
${[['34','192.0.2','2024-01-01','2024-01-23'],['2','198.51.100','2024-01-12','2024-01-15'],['1','203.0.113','2024-01-18','2024-01-18']].map(r=>`<tr><td class="ip" data-p="${r[1]}">${r[1]}.xxx</td><td><span class="chip">Unknown</span></td><td>${r[0]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>
<div style="margin-top:14px"><button class="btn primary" onclick="toast('Would download ~12 MB city file')">Load city-level detail (~12 MB)</button> <span class="note">Nothing from your export is sent.</span></div>`;
function ipToggle(b){const s=b.textContent.startsWith('Show');document.querySelectorAll('.ip').forEach(c=>c.textContent=c.dataset.p+(s?'.17':'.xxx'));b.textContent=s?'Hide full IP addresses':'Show full IP addresses'}
const spend=()=>`<div class="tiles" style="grid-template-columns:1fr 1fr 1fr"><div class="tile"><div class="k">USD spent</div><div class="v">9.99</div></div><div class="tile"><div class="k">Paid orders</div><div class="v">1</div></div><div class="tile"><div class="k">Failed / new</div><div class="v">0 / 0</div></div></div><p class="note">Each currency has its own total: nothing is converted or added across currencies.</p>`;
const vehicles=()=>`<div style="display:flex;gap:10px;margin-bottom:12px"><select><option>WoT</option></select><input class="search" placeholder="Search vehicles"></div><p class="note">WoT is not in this export.</p>`;
const NAV=[['Playtime & logins','on'],['Vehicles',''],['Finance','off'],['Payments',''],['Account','']];
const ident=`<div class="avatar">T</div><div><h1>Tester</h1><div class="muted">Account 123456789 · EU · created 2024-01-01</div></div>`;
const actions=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="toast('Start over?')">Start over</button><button class="btn" onclick="toast('Cache cleared')">Clear cached data</button></div>`;
const secs={play:`<div class="card wide c12"><h2>Playtime</h2><div class="sub">When and how long you played</div>${server()}${tiles()}</div>`};
function D(){return `<div class="app t-bento d"><div class="bar"><h1><span class="avatar" style="width:36px;height:36px;font-size:15px;color:#0b0d12">T</span>Tester <span class="muted" style="font-weight:400;font-size:13px">123456789 · EU</span></h1><div class="pills">${NAV.map(([n,c])=>`<a class="${c==='on'?'on':''}" onclick="navClick(this)">${n}</a>`).join('')}</div>${actions}</div>
<main>
<div class="card big s2 r2"><div class="k">Total playtime</div><div class="v">31.2<span style="font-size:22px"> h</span></div><div class="muted" style="margin-top:8px">across 30 sessions on 21 days</div>${server()}</div>
<div class="card kpi"><div class="k">Sessions</div><div class="v">30</div></div>
<div class="card kpi"><div class="k">Active days</div><div class="v">21</div></div>
<div class="card kpi"><div class="k">Login IPs</div><div class="v">3</div><div class="delta">37 logins</div></div>
<div class="card kpi"><div class="k">USD spent</div><div class="v">9.99</div><div class="delta">1 paid order</div></div>
<div class="card s4"><h2>Hours per day</h2><div class="sub">2024</div>${cal()}${legend()}</div>
<div class="card s2"><h2>Weekday & time</h2><div class="sub">Evenings dominate</div>${hr()}${legend()}</div>
<div class="card s2"><h2>Session length</h2><div class="sub">Mostly 1-2 hours</div>${bars()}</div>
<div class="card s4 scroll"><h2>Login history</h2><div class="sub">3 addresses</div>${login()}</div>
<div class="card s2"><h2>Vehicles</h2><div class="sub">Per-vehicle stats</div>${vehicles()}</div>
<div class="card s2"><h2>Payments</h2><div class="sub">Real-money spend</div>${spend()}</div>
</main></div>`}
function E(){return `<div class="app t-wrap e"><div class="dots">${[1,2,3,4,5].map(()=>'<i></i>').join('')}</div><div class="snap">
<section class="panel"><div class="kick">Your Wargaming data export</div><div class="huge">Tester</div><div class="line">Account 123456789 · EU · since 2024</div><div style="margin-top:22px">${actions}</div><div class="more">scroll ↓</div></section>
<section class="panel"><div class="kick">You played</div><div class="huge">31.2h</div><div class="line">across 30 sessions on 21 different days</div><div class="inner">${server()}</div></section>
<section class="panel"><div class="kick">Your busiest hour</div><div class="huge">19:00</div><div class="line">Evenings and weekends are your battleground</div><div class="inner">${cal()}${hr()}${legend()}</div></section>
<section class="panel"><div class="kick">Typical session</div><div class="huge">1-2h</div><div class="line">Over half your sessions run this long</div><div class="inner">${bars()}</div></section>
<section class="panel"><div class="kick">You logged in from</div><div class="huge">3 IPs</div><div class="line">37 logins · 0 countries matched</div><div class="inner">${login()}<div style="height:18px"></div>${spend()}</div></section>
</div></div>`}
function F(){const tab=(n,c)=>`<a class="${c}" onclick="fTab(this)">${n}</a>`;
return `<div class="app t-tac f"><div class="hdr"><div><div class="id">Service record · Account 123456789 · EU · created 2024-01-01</div><h1>Tester</h1></div>${actions}</div>
<div class="tabs">${[['Playtime','on'],['Logins',''],['Vehicles',''],['Finance','off'],['Payments','']].map(([n,c])=>tab(n,c)).join('')}</div>
<main>
<div class="pane on" data-p="Playtime"><div class="card"><h2>Overview</h2>${server()}${tiles()}</div><div class="two"><div class="card"><h2>Hours per day</h2><div class="sub">2024</div>${cal()}${legend()}</div><div class="card"><h2>Session length</h2><div class="sub">Mostly 1-2 hours</div>${bars()}</div></div><div class="card"><h2>Weekday & time of day</h2>${hr()}${legend()}</div></div>
<div class="pane" data-p="Logins"><div class="card"><h2>Login history</h2><div class="sub">3 addresses · 37 logins</div>${login()}</div></div>
<div class="pane" data-p="Vehicles"><div class="card"><h2>Vehicles</h2>${vehicles()}</div></div>
<div class="pane" data-p="Finance"><div class="card"><h2>Finance</h2><p class="note">Not in this export.</p></div></div>
<div class="pane" data-p="Payments"><div class="card"><h2>Payments</h2>${spend()}</div></div>
</main></div>`}
function fTab(el){el.parentElement.querySelectorAll('a').forEach(a=>a.classList.remove('on'));el.classList.add('on');document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.dataset.p===el.textContent))}
const R={d:D,e:E,f:F};
function show(v){$('#root').innerHTML=R[v]();document.querySelectorAll('.variant-tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v))}
document.querySelectorAll('.variant-tab').forEach(t=>t.onclick=()=>show(t.dataset.v));
show('d');
</script></body></html>
